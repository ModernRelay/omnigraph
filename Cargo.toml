[workspace]
resolver = "2"
members = [
    "crates/omnigraph-compiler",
    "crates/omnigraph",
    "crates/omnigraph-cli",
    "crates/omnigraph-api-types",
    "crates/omnigraph-cluster",
    "crates/omnigraph-server",
]
default-members = [
    "crates/omnigraph",
    "crates/omnigraph-cli",
    "crates/omnigraph-server",
]

[workspace.dependencies]
arrow-array = "58"
arrow-ipc = "58"
arrow-schema = "58"
arrow-select = "58"
arrow-cast = { version = "58", features = ["prettyprint"] }
arrow-ord = "58"

datafusion = { version = "54", default-features = false, features = ["nested_expressions"] }
datafusion-physical-plan = "54"
datafusion-physical-expr = "54"
datafusion-execution = "54"
datafusion-common = "54"
datafusion-expr = "54"
datafusion-functions-aggregate = "54"

# Lance 9.0.0 (crates.io). The 9.x prereleases were git-tags only, so this
# workspace rev-pinned `v9.0.0-rc.1` (cec0b7df) until the stable release
# landed on 2026-07-24; registry versions retire that git pin and restore
# ordinary publishability. Carries lance#7480 (rowid overlap, closes #7444 ->
# vendor pin retired) and lance#7320 (BTREE segment-merge, closes #7230).
# See docs/dev/lance.md.
lance = { version = "9.0.0", default-features = false, features = ["aws"] }
lance-core = "9.0.0"
# RowAddrTreeMap moved from lance-core::utils::mask to the new lance-select crate in 9.x.
lance-select = "9.0.0"
lance-datafusion = "9.0.0"
lance-file = "9.0.0"
lance-index = "9.0.0"
lance-linalg = "9.0.0"
lance-namespace = "9.0.0"
lance-namespace-impls = "9.0.0"
lance-table = "9.0.0"

ulid = "1"
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pest = "2"
pest_derive = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
color-eyre = "0.6"
tempfile = "3"
ahash = "0.8"
arc-swap = "1"
base64 = "0.22"
ariadne = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
object_store = { version = "0.13.2", default-features = false, features = ["aws", "fs"] }
fail = "0.5"
time = { version = "0.3", features = ["formatting"] }
axum = { version = "0.8", features = ["json", "macros"] }
utoipa = { version = "5", features = ["axum_extras"] }
url = "2"
cedar-policy = "4.9"
sha2 = "0.10"
subtle = "2"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
