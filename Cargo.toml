[workspace]
resolver = "2"
members = [
    "crates/omnigraph-compiler",
    "crates/omnigraph-storage",
    "crates/omnigraph",
    "crates/omnigraph-cli",
    "crates/omnigraph-api-types",
    "crates/omnigraph-cluster",
    "crates/omnigraph-policy",
    "crates/omnigraph-server",
    "crates/omnigraph-bench",
]
default-members = [
    "crates/omnigraph",
    "crates/omnigraph-cli",
    "crates/omnigraph-server",
]

[workspace.dependencies]
arrow-array = "58"
arrow-ipc = "58"
arrow-schema = "58"
arrow-select = "58"
arrow-cast = { version = "58", features = ["prettyprint"] }
arrow-ord = "58"
arrow-string = "58"

datafusion = { version = "54", default-features = false, features = ["nested_expressions", "string_expressions"] }
datafusion-physical-plan = "54"
datafusion-physical-expr = "54"
datafusion-execution = "54"
datafusion-common = "54"
datafusion-expr = "54"
datafusion-functions-aggregate = "54"

# Lance 10.0.0 (crates.io). This closes the stable-row-id delete/index,
# stale-index-coverage, and Blob null/empty correctness gaps carried by the
# 9.0.0 pin. Its ordered-coalesce fix remains locally fenced for late payload
# hydration; see docs/dev/lance.md.
lance = { version = "10.0.0", default-features = false, features = ["aws"] }
lance-core = "10.0.0"
# RowAddrTreeMap moved from lance-core::utils::mask to the new lance-select crate in 9.x.
lance-select = "10.0.0"
lance-datafusion = "10.0.0"
lance-file = "10.0.0"
lance-index = "10.0.0"
lance-linalg = "10.0.0"
lance-namespace = "10.0.0"
lance-namespace-impls = "10.0.0"
lance-table = "10.0.0"

ulid = "1"
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pest = "2"
pest_derive = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
color-eyre = "0.6"
tempfile = "3"
ahash = "0.8"
arc-swap = "1"
base64 = "0.22"
bytes = "1"
ariadne = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
object_store = { version = "0.13.2", default-features = false, features = ["aws", "fs"] }
fail = "0.5"
time = { version = "0.3", features = ["formatting"] }
axum = { version = "0.8", features = ["json", "macros"] }
utoipa = { version = "5", features = ["axum_extras"] }
url = "2"
cedar-policy = "4.9"
sha2 = "0.10"
subtle = "2"

[workspace.lints.clippy]
# Nested guards often read clearer than one merged condition (Polars allows this too).
collapsible_if = "allow"
# Streaming/recovery internals thread identity + authority + payload explicitly;
# a params-struct refactor is not earned yet.
too_many_arguments = "allow"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
