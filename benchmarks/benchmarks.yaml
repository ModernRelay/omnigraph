# Fixtures describe starting states; workloads describe operations and checks.
# Named runs and settings live here. Large history groups are explicitly opt-in.
version: 2
defaults:
  repetitions: 1
  deadline_seconds: 60
  environment:
    backend:
      kind: local-fs
      filesystem: apfs
      storage_class: nvme-ssd
  protocol:
    attribution: per-phase
    schedule: manual
    reset: local-clonefile
    timer: monotonic
scenarios:
