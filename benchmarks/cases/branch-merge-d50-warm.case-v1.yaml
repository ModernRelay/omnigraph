version: 1
id: branch-merge-d50-warm
scenario: branch-merge-v1

fixture:
  builder:
    kind: synthetic-branch-merge
    version: 1
    seed: 0
  data:
    provenance: synthetic
    tables: 8
    rows_per_table: 100000
    payload_bytes: 64
    column_shape: scalars
    topology_skew: uniform
  state:
    aging: bulk-loaded
    indexes: []
    deletion_history: none
    compaction_recency: not-optimized
    history_depth: 1

workload:
  delta_rows_per_side: 50
  diverged_tables: 4
  arrival: unscheduled-single-shot
  clients: 1
  read_write_mix: write-heavy
  contention: distinct-key

environment:
  backend:
    kind: local-fs
    filesystem: apfs
    storage_class: nvme-ssd
  network_position: same-host
  execution: embedded
  cache_condition:
    process: fresh-per-repetition
    engine: warmed-by-program
    page_cache: program-conditioned
    program: branch-merge-read-set-v1
    iterations: 1

protocol:
  deadline_seconds: 60
  attribution: per-phase
  schedule: manual
  reset: plain-copy
  timer: monotonic
