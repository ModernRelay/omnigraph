# cargo-deny configuration: the pull-request gate on what the dependency
# graph may contain. Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
# A change to what the graph may contain (a new source, license, or advisory
# exemption) is an edit to this file in the same pull request; every `ignore`
# entry is a reviewed exemption. Needs cargo-deny 0.19 or newer (`unsound` scope,
# `unused-ignored-advisory`).

[graph]
# Include feature-gated dependencies (the `aws` SDK crates ship in the
# AWS-feature artifacts), so the gate sees the whole shippable tree.
all-features = true

[advisories]
# A yanked version still builds from a lockfile; the gate refuses it.
yanked = "deny"
# Unsound advisories fail on every crate in the graph, not only on direct
# workspace dependencies (the default `workspace` scope skips transitive ones).
unsound = "all"
# Each ignore names the crate, the dependency path that pins it, and what
# clears it. An ignore covers the advisory on every version of the crate, so a
# reason that names one version is a statement of intent, not a constraint.
# An ignore that matches nothing fails the check, so the bump that clears an
# advisory also removes its row here.
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; a proc-macro pulled by lance-bitpacking 13.0.0, cleared when Lance replaces it" },
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 Marvin timing side channel via reqsign (lance-io, opendal); RustSec lists no patched version" },
  # zstd 0.13 and its zstd-safe 7 are pinned by arrow-ipc 58.3.0 (`zstd = "0.13.0"`)
  # and lance-encoding 13.0.0 (`zstd = "0.13"`); the patched line is zstd 0.14.3 with
  # zstd-safe 8.2.0, taken when arrow and Lance move. Those two crates reach only the
  # bulk API and `stream::copy_decode` (a `read::Decoder` on a fresh context); no
  # workspace crate names zstd. Each row names the API the advisory is about.
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 `with_context` stream constructors on a borrowed context; arrow-ipc and lance-encoding build every context themselves (bulk, `copy_decode`); cleared by zstd 0.14.3" },
  { id = "RUSTSEC-2026-0395", reason = "zstd-safe 7.2.4 `CParameter::StableInBuffer`; never set by zstd 0.13.3 or its two dependents; cleared by zstd-safe 8.2.0" },
  { id = "RUSTSEC-2026-0396", reason = "zstd-safe 7.2.4 `Seekable` seek table; the seekable API is not used; cleared by zstd-safe 8.2.0" },
  { id = "RUSTSEC-2026-0397", reason = "zstd-safe 7.2.4 `OutBuffer::around_pos`; zstd 0.13.3 never calls it and no crate uses zstd-safe streaming directly (lance-encoding calls only `compress_bound`); cleared by zstd-safe 8.2.0" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.2.4 `Seekable::decompress`; the seekable API is not used; cleared by zstd-safe 8.2.0" },
  { id = "RUSTSEC-2026-0399", reason = "zstd-safe 7.2.4 `init_using_cdict` / `init_using_ddict`; no dictionary is used; cleared by zstd-safe 8.2.0" },
  { id = "RUSTSEC-2026-0400", reason = "zstd-safe 7.2.4 one-shot dictionary call on a context with an open stream; no dictionary is used and the bulk contexts never carry a stream; cleared by zstd-safe 8.2.0" },
  { id = "RUSTSEC-2026-0401", reason = "zstd-safe 7.2.4 `train_from_buffer`; no dictionary is trained; cleared by zstd-safe 8.2.0" },
  { id = "RUSTSEC-2026-0402", reason = "zstd-safe 7.2.4 `CCtx::try_clone` on a multithreaded context; neither `try_clone` nor `zstdmt` is used; cleared by zstd-safe 8.2.0" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.2.4 legacy frame through `stream::write::Decoder`; the tree decodes through `read::Decoder` and the bulk API, which the advisory lists as unaffected; cleared by zstd-safe 8.2.0" },
  { id = "RUSTSEC-2026-0404", reason = "zstd-safe 7.2.4 `DCtx::try_clone`; not used; cleared by zstd-safe 8.2.0" },
  { id = "RUSTSEC-2026-0405", reason = "zstd-safe 7.2.4 out-of-range `InBuffer::pos` in the seekable compress stream; the seekable API is not used; cleared by zstd-safe 8.2.0" },
  { id = "RUSTSEC-2026-0406", reason = "zstd-safe 7.2.4 changing a multithreaded context with an unfinished frame; `zstdmt` is not used; cleared by zstd-safe 8.2.0" },
]

[licenses]
# An allowed license no crate carries fails the check: the list is exactly
# what the tree needs, and a bump that drops the last holder also drops the entry.
unused-allowed-license = "deny"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "Zlib",
  # File-level copyleft: obligations attach only to modified MPL files, none
  # ship here. Holders: `colored`, `option-ext` (via `dirs`).
  "MPL-2.0",
  # Mozilla's root-certificate bundle data (`webpki-roots`, `webpki-root-certs`).
  "CDLA-Permissive-2.0",
]

[bans]
# An 839-crate tree cannot avoid two versions of one crate; that is hygiene,
# not integrity, so it stays out of the gate.
multiple-versions = "allow"
# `foo = "*"` is never acceptable. A wildcard path dependency is exempt only in a
# `publish = false` crate or as a dev-dependency (cargo-deny `bans.rs`).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io is the only registry and no dependency comes from git; a fork enters
# through `allow-git` (a git-form `[patch]` entry included). A `path` copy, bare or
# behind `[patch]`, and a `.cargo/config.toml` source replacement keep no source
# cargo-deny checks: the diff review is that gate.
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
allow-git = []
