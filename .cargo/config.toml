# Cargo config for the omnigraph workspace.
#
# `[build] rustflags` is the ONE place this repo sets compiler flags, so the
# flags no longer depend on the directory cargo runs from (rustflags are
# part of every fingerprint; a directory-dependent set built each crate
# twice). Overrides, in Cargo's precedence order: CARGO_ENCODED_RUSTFLAGS,
# RUSTFLAGS (empty included), target.<triple>.rustflags — each REPLACES
# this list; a cargo run outside the checkout (`--manifest-path`) never
# reads it. Every release build (release.yml, release-edge.yml,
# publish-image.yml, omnigraph-package.yml, scripts/install-source.sh, the
# documented source build) and the benchmark build set an empty RUSTFLAGS:
# shipped binaries never carry the cfg below, it serves the test suites only.
#
# `[env]` entries here apply to anything cargo launches in this repo —
# `cargo build`, `cargo test`, `cargo run`. Shipped binaries are NOT
# affected: the env var lives only in the cargo-launched process, not in
# release artifacts or Docker images.

[build]
# tokio's seeded scheduler (`Builder::rng_seed`) sits behind this cfg;
# `omnigraph-dst` and the GQT DST runner need it, no other crate names it.
# In tokio 1.52 the cfg also compiles in runtime metrics counters, a
# spawn-location pointer per task and per-poll checks of optional (unset)
# hooks; that runtime cost is unmeasured. The DST suite stays out of
# `cargo test --workspace` by an explicit `--exclude omnigraph-dst`.
rustflags = ["--cfg", "tokio_unstable"]

[env]
# Lance's DataFusion memory pool per `Omnigraph` instance. Lance defaults
# to 100 MB (`lance-datafusion/src/exec.rs`), which is fine for a single
# server process in production.
#
# Under `cargo test` it's a problem: the omnigraph-server integration
# suite spins up many `Omnigraph` instances in parallel (one per test,
# default `num_cpus` threads), each with concurrent BTree index builds
# sharing that test's 100 MB pool — saturates quickly and surfaces as
# `Not enough memory to continue external sort` / `0.0 B remain
# available for the total pool`.
#
# 1 GB is comfortable headroom per-test pool; prod and CI-for-prod
# builds set the variable themselves (or keep the 100 MB default).
LANCE_MEM_POOL_SIZE = "1073741824"
