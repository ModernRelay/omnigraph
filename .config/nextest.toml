# `Test Workspace` runs the workspace graph with `cargo nextest run --profile ci`
# (ci.yml): one scheduler over every test of every binary, a process per test.
# The JUnit report is what `scripts/check-workspace-test-owners.py` reads for
# each required owner's verdict and for the captured output of the upgrade
# journeys, in place of grepping a `--nocapture` log.
[profile.ci]
fail-fast = true
# A hung test fails as a named test after ten minutes instead of holding the
# job to its 60-minute limit. The longest test either `ci` run selects
# (`Test Workspace`, `tests-slow-nightly.yml`) takes about a minute locally.
slow-timeout = { period = "60s", terminate-after = 10 }
# The job log is read for its failures: a pass prints no line (5,367 `PASS`
# lines hang GitHub's log viewer), a test still running after a minute prints
# its `SLOW` line, a failure prints with its captured output where it happens
# and again in the final summary, so the end of the log is the list of
# failures. The JUnit report below is written from the run's results and does
# not depend on these.
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
report-name = "test-workspace"
store-success-output = true
store-failure-output = true
