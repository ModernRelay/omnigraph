# Predecessors: older Omnigraph binaries the cross-version tests run beside
# the current tree. One row per predecessor; adding one is a row here, never
# workflow YAML. `scripts/predecessors.py` provisions the rows a job names and
# writes one manifest; a test asks for a row with `predecessor("<name>")`
# (docs/dev/testing.md, Predecessor binaries).
#
# A row is named by what it is, and holds:
#   about        what the binary is and what it writes
#   release      a published release tag, installed by `scripts/install.sh`,
#   sha256       with the archive digest pinned per platform asset; or
#   commit       a commit of this repository, built from source in its own
#   toolchain    checkout with this Rust toolchain
#   binaries     the executables it provides (keys of [packages])
#   reports      what `omnigraph --version` prints; checked when provisioned
#                and again when a test asks for the row
#   retire_when  the condition under which the row and its tests go
#
# Every row must be asked for by a test, and every name a test asks for must
# be a row (`scripts/predecessors.py check`).

# The package that builds each binary a source row can provide.
[packages]
omnigraph = "omnigraph-cli"
omnigraph-server = "omnigraph-server"
omnigraph-gqt = "omnigraph-gqt"

[predecessors."release-0.7.2"]
about = "Release 0.7.2, which writes internal schema v3: lineage in `_graph_commits.lance` and a lineage-free `__manifest`"
release = "v0.7.2"
sha256 = { linux-x86_64 = "1f3f4e13a3f7f43267c944d208194a01fc2e357fe97f2d2c50af4bef23db332c", macos-arm64 = "99acb216210591c718f9bdd5d2d1ca9922789c710f324d7fd8e54029d418edb3" }
binaries = ["omnigraph"]
reports = "omnigraph 0.7.2"
retire_when = "The current binary no longer refuses and rebuilds a v3 graph"

[predecessors."release-0.8.1"]
about = "Release 0.8.1, which writes internal schema v4"
release = "v0.8.1"
sha256 = { linux-x86_64 = "c25e2bb5358887e64e33d3135370e80ea215a54608df723d97d9cac67b7f9e3e", linux-arm64 = "903750141ca449a386d6bc44949d6cb19e0965e6ebcbf6def2961d4841359a41", macos-arm64 = "866e92eda453ee30acbfcaaed4f5a59accf2ad602964d6076c01c8da2637e282" }
binaries = ["omnigraph"]
reports = "omnigraph 0.8.1"
retire_when = "The current binary no longer refuses and rebuilds a v4 graph"

[predecessors."stamp-5"]
about = "The last main commit that writes internal schema v5, immediately before RFC 0023 made the non-null `id` primary key exact in v6"
commit = "46b6d9084fb629b88d4ac9e8c546e0a30d213d19"
toolchain = "1.97.1"
binaries = ["omnigraph"]
reports = "omnigraph 0.8.1"
