# The `Dependency Guard (cargo deny)` check again, on `main`, once a day:
# the RustSec database is fetched at run time, so an advisory published
# after the last push shows here before it reds every open pull request.
# Nothing waits on it; a red run is the signal to open the lockfile-bump or
# `deny.toml` pull request.
name: Dependency guard nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo_deny_nightly:
    name: Dependency Guard nightly (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Check dependency sources
        run: python3 scripts/check-dependency-sources.py

      - name: Check dependency sources, advisories, licenses and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked
