name: Release vocabulary gate

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref or commit to resolve once as the release source.
        required: true
        type: string
      ci_run_id:
        description: Exact CI run that authorized an automatic release.
        required: false
        default: ""
        type: string
      walk_back:
        description: >-
          Without ci_run_id, select the newest audited commit among this many
          first-parent commits ending at source_ref; 0 audits source_ref alone.
        required: false
        default: 0
        type: number
    outputs:
      source_sha:
        description: Immutable audited commit used by every release checkout.
        value: ${{ jobs.verify.outputs.source_sha }}

jobs:
  verify:
    name: Verify exact-SHA vocabulary audit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve release source once
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: ${{ inputs.walk_back > 0 && inputs.walk_back || 1 }}
          persist-credentials: false

      - name: Record immutable source candidates
        id: candidates
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          WALK_BACK: ${{ inputs.walk_back }}
        run: |
          set -euo pipefail
          [[ "$WALK_BACK" =~ ^[0-9]+$ ]]
          if [[ "$WALK_BACK" -gt 0 && -n "$CI_RUN_ID" ]]; then
            echo "::error::a CI run authorizes exactly one commit; walk_back needs no ci_run_id"
            exit 1
          fi
          count=$(( WALK_BACK > 0 ? WALK_BACK : 1 ))
          git rev-list --first-parent -n "$count" 'HEAD^{commit}' > "$RUNNER_TEMP/candidates"
          while read -r sha; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          done < "$RUNNER_TEMP/candidates"
          echo "path=$RUNNER_TEMP/candidates" >> "$GITHUB_OUTPUT"

      - name: Require successful vocabulary audit
        id: source
        env:
          CANDIDATES: ${{ steps.candidates.outputs.path }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(head -n 1 "$CANDIDATES")"

          audit_succeeded_in_run() {
            local run_id="$1"
            local jobs
            jobs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100")"
            jq -e --arg sha "$SOURCE_SHA" '
              .jobs
              | any(
                  .name == "Graph Vocabulary Guard"
                  and .head_sha == $sha
                  and .status == "completed"
                  and .conclusion == "success"
                )
            ' <<<"$jobs" >/dev/null
          }

          if [[ -n "$CI_RUN_ID" ]]; then
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
            jq -e --arg sha "$SOURCE_SHA" '
              .path == ".github/workflows/ci.yml"
              and .head_sha == $sha
              and (.event == "push" or .event == "workflow_dispatch")
            ' <<<"$run" >/dev/null || {
              echo "::error::CI run ${CI_RUN_ID} does not authorize source ${SOURCE_SHA}"
              exit 1
            }
            # `needs` guarantees the audit job completed, but allow the Jobs
            # REST view a short consistency window before failing closed.
            for _ in $(seq 1 12); do
              if audit_succeeded_in_run "$CI_RUN_ID"; then
                echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 5
            done
            echo "::error::CI run ${CI_RUN_ID} has no successful exact-SHA Graph Vocabulary Guard"
            exit 1
          fi

          # Manual backfills and scheduled builds may reuse an earlier audit of
          # the exact commit, but a skipped pull-request context never
          # qualifies. With walk_back, the newest audited candidate wins.
          mapfile -t candidates < "$CANDIDATES"
          for SOURCE_SHA in "${candidates[@]}"; do
            mapfile -t run_ids < <(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SOURCE_SHA}&per_page=100" \
                --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id'
            )
            for run_id in "${run_ids[@]}"; do
              if audit_succeeded_in_run "$run_id"; then
                echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          SOURCE_SHA="${candidates[0]}"

          echo "::error::source ${SOURCE_SHA} and the commits searched before it have no successful non-PR Graph Vocabulary Guard"
          echo "Audit the exact ref first, then retry the manual release. Historical pre-guard tags require an explicit policy decision."
          exit 1
