name: Publish container image

# Build and publish the omnigraph-server container image to GHCR so
# downstream deployments can pull it without building from source.
#
# Kept separate from release.yml on purpose: an image-publish failure must
# not block the binary release / Homebrew chain, and a manual backfill of an
# old tag must not re-run the four-platform release matrix.
#
# Automatic tag publication is called by CI only after the exact commit passes
# the vocabulary audit. Manual backfills reuse a prior exact-commit audit.
#
# The binaries are compiled inside a rust:1-bookworm container, NOT on the
# runner host: the Dockerfile's runtime base is debian bookworm-slim
# (glibc 2.36), and binaries built on ubuntu-latest (glibc 2.39) do not run
# there. Builder and runtime must share the same distro release. They carry
# the same commit and `stable` channel stamp as the release archives
# (`build-release-archives.yml`), checked in the image before it is pushed,
# and the pushed digest carries a build provenance attestation.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish an image for (e.g. v0.8.1). Required for manual dispatches."
        required: true
        type: string

jobs:
  vocabulary_gate:
    name: Require audited image source
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-vocabulary-gate.yml
    with:
      source_ref: ${{ inputs.source_ref || format('refs/tags/{0}', inputs.tag) }}
      ci_run_id: ${{ inputs.ci_run_id || '' }}

  publish_image:
    name: Build and push image
    needs: vocabulary_gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ needs.vocabulary_gate.outputs.source_sha }}
    steps:
      # The dispatch `tag` input is free-form; without this guard a dispatcher
      # could pass a branch name or SHA and publish non-release code under a
      # release-looking image tag. Require an existing v* tag ref.
      - name: Validate release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${RELEASE_TAG}" == v* ]] \
            || { echo "tag must be a v* release tag, got: ${RELEASE_TAG}" >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null \
            || { echo "no such tag: ${RELEASE_TAG}" >&2; exit 1; }
          # Releases before v0.14.0 predate the commit and channel stamp and
          # release attestations, as in release.yml's `release_source`.
          stamped=false
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version=$(( 10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]} ))
            (( version >= 14000 )) && stamped=true
          fi
          echo "stamped=${stamped}" >> "$GITHUB_OUTPUT"

      # The provenance predicate names the run's commit (its OIDC `sha`
      # claim), not the checkout. A tag push runs at the tagged commit; a
      # manual backfill attests only when dispatched at the tag itself.
      # Decided before anything is pushed.
      - name: Require the run's commit to be the built commit
        id: provenance
        env:
          STAMPED: ${{ steps.tag.outputs.stamped }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]; then
            echo "attest=true" >> "$GITHUB_OUTPUT"
          elif [[ "$STAMPED" == true ]]; then
            echo "::error::this run is for ${GITHUB_SHA}, not ${RELEASE_TAG} (${SOURCE_SHA}); dispatch the backfill at refs/tags/${RELEASE_TAG} so its provenance names the built commit"
            exit 1
          else
            echo "::warning::${RELEASE_TAG} predates release attestations and this run is for ${GITHUB_SHA}; publishing without provenance"
            echo "attest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}

      # Read at compile time by `omnigraph version` and the server's
      # `/healthz` `source_version`.
      - name: Build release binaries (bookworm builder)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e OMNIGRAPH_SOURCE_VERSION="$SOURCE_SHA" -e OMNIGRAPH_RELEASE_CHANNEL=stable \
            rust:1-bookworm bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
            # A set RUSTFLAGS, empty included, replaces the workspace `[build]
            # rustflags` (.cargo/config.toml): the image builds without the cfg.
            export RUSTFLAGS=
            # --features omnigraph-server/aws: include the AWS Secrets Manager
            # bearer-token source so one public image serves both token modes.
            cargo build --release --locked \
              -p omnigraph-cli \
              -p omnigraph-server \
              -p omnigraph-azure-admission \
              --features omnigraph-server/aws
          '

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Verify release tag still selects audited source
        run: |
          set -euo pipefail
          refs="$(git ls-remote origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          tag_sha="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<<"$refs")"
          if [[ -z "$tag_sha" ]]; then
            tag_sha="$(awk 'NR == 1 {print $1}' <<<"$refs")"
          fi
          [[ "$tag_sha" == "$SOURCE_SHA" ]] || {
            echo "::error::${RELEASE_TAG} now selects ${tag_sha:-nothing}, expected ${SOURCE_SHA}"
            exit 1
          }

      - name: Build and push image
        id: push
        env:
          STAMPED: ${{ steps.tag.outputs.stamped }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/omnigraph-server"
          docker build -t "${image}:${RELEASE_TAG}" .
          docker run --rm --entrypoint /usr/local/bin/omnigraph \
            "${image}:${RELEASE_TAG}" version
          if [[ "$STAMPED" == true ]]; then
            docker run --rm --entrypoint /usr/local/bin/omnigraph \
              "${image}:${RELEASE_TAG}" version --json > "$RUNNER_TEMP/version.json"
            python3 - "$RUNNER_TEMP/version.json" <<'PY'
          import json, os, sys
          facts = json.load(open(sys.argv[1]))
          expected = ("stable", os.environ["SOURCE_SHA"])
          if (facts["channel"], facts["commit"]) != expected:
              raise SystemExit(f"image reports {facts['channel']}/{facts['commit']}, expected {expected}")
          PY
          fi
          docker run --rm --entrypoint /usr/local/bin/omnigraph-server \
            "${image}:${RELEASE_TAG}" --help >/dev/null
          docker run --rm --entrypoint /usr/local/bin/omnigraph-azure-admission \
            "${image}:${RELEASE_TAG}" --help >/dev/null
          docker push "${image}:${RELEASE_TAG}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:${RELEASE_TAG}")"
          digest="${digest#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          # Move `latest` only on real tag pushes — a dispatch backfill of an
          # old tag must not repoint `latest` at it.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            docker tag "${image}:${RELEASE_TAG}" "${image}:latest"
            docker push "${image}:latest"
          fi

      # The GHCR digest is attested and the attestation is stored beside the
      # image; Docker Hub carries no attestation of its own.
      - name: Attest image provenance
        if: steps.provenance.outputs.attest == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Docker Hub is the primary public distribution channel (anonymous pulls
      # for deployments). Skipped when the DOCKERHUB_* secrets are not
      # configured, so forks and the GHCR-only path keep working. With an org
      # access token, DOCKERHUB_USERNAME is the ORG name — which is also the
      # image namespace.
      # continue-on-error so a Hub failure can't suppress the digest summary
      # for the already-pushed GHCR image; the fail-gate step below still
      # fails the run afterwards.
      - name: Push to Docker Hub
        id: dockerhub
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "DOCKERHUB_* secrets not configured; skipping Docker Hub publish."
            exit 0
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ghcr_image="ghcr.io/${owner}/omnigraph-server"
          hub_image="docker.io/${DOCKERHUB_USERNAME}/omnigraph-server"

          echo "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

          docker tag "${ghcr_image}:${RELEASE_TAG}" "${hub_image}:${RELEASE_TAG}"
          docker push "${hub_image}:${RELEASE_TAG}"

          # Same `latest` policy as GHCR: real tag pushes only, never backfills.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            docker tag "${ghcr_image}:${RELEASE_TAG}" "${hub_image}:latest"
            docker push "${hub_image}:latest"
          fi

      - name: Report pinned digests
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "## Container image published"
            echo
            echo '```'
            for image in "ghcr.io/${owner}/omnigraph-server" \
                         ${DOCKERHUB_USERNAME:+"docker.io/${DOCKERHUB_USERNAME}/omnigraph-server"}; do
              echo "${image}:${RELEASE_TAG}"
              # RepoDigests may store Hub images with or without the
              # docker.io/ prefix depending on the Docker version.
              docker inspect --format='{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}' \
                "${image}:${RELEASE_TAG}" | grep -E "^(docker\.io/)?${image#docker.io/}@" || true
            done
            echo '```'
            echo
            echo "Pin deployments to the digest form."
          } >> "$GITHUB_STEP_SUMMARY"

      # The summary above always runs; a Docker Hub failure still fails the
      # run here so operators notice.
      - name: Fail if Docker Hub push failed
        if: steps.dockerhub.outcome == 'failure'
        run: |
          echo "Docker Hub push failed (GHCR image was pushed; see summary)." >&2
          exit 1
