name: Bench Binaries

# The benchmark lab's three binaries, built where the commit lands. One job on
# GitHub's arm64 runner inside the Amazon Linux 2023 container the lab's
# campaign machine runs (glibc 2.34; a binary linked on Ubuntu 24.04 needs
# 2.39 and does not start there): `cargo build --release --locked` of
# `omnigraph-cli`, of `omnigraph-bench` and of `omnigraph-server`, one package
# per call so no binary's features depend on another's manifest, RUSTFLAGS
# empty as the lab and the release archives build. The server is the one
# `omnigraph-bench run --server-product` starts beside the `omnigraph` of the
# same commit. The artifact `bench-binaries-<sha>` is what the lab shelves
# under `binaries/<sha>/`: the three binaries, their
# `sha256sum` lines, the public catalog `benchmarks/` and `build.json`. The
# sha is the commit built: a pull request's head, never GitHub's merge commit.
# Nothing here talks to AWS; the lab pulls the artifact.
#
# A second job then starts the harness from that artifact as the campaign
# machine does, in the same image with no checkout, no `git` and no toolchain.

on:
  push:
    branches:
      - main
      - 'bench/**'
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build omnigraph and omnigraph-bench (arm64, AL2023)
    # A pull request builds only under the lab's `benchmark` label, the label
    # the lab's watcher measures; every other trigger builds.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-24.04-arm
    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "5"
      # A set RUSTFLAGS, empty included, replaces the workspace `[build]
      # rustflags` (.cargo/config.toml): the lab's binaries build without the cfg.
      RUSTFLAGS: ""
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Before the checkout: with git in the container the checkout keeps
      # `.git`, which the harness's build script reads for its source commit.
      - name: Install build tools
        run: dnf install -y -q clang gcc gcc-c++ make openssl-devel pkgconf-pkg-config protobuf-compiler protobuf-devel git tar gzip python3 which

      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      # rustup with no default toolchain, then the toolchain `rust-toolchain.toml`
      # pins, each download tried three times: one connect timeout to
      # static.rust-lang.org is a retried step here, not a lost build.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SOURCE_SHA must be a full commit id"; exit 1; }
          for try in 1 2 3; do
            if curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path; then break; fi
            [ "$try" -lt 3 ] || exit 1
            sleep 20
          done
          export PATH="$HOME/.cargo/bin:$PATH"
          for try in 1 2 3; do
            if rustup toolchain install --profile minimal; then break; fi
            [ "$try" -lt 3 ] || exit 1
            sleep 20
          done
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
          shared-key: bench-binaries-aarch64-al2023
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build omnigraph
        run: cargo build --release --locked -p omnigraph-cli

      - name: Build omnigraph-bench
        run: cargo build --release --locked -p omnigraph-bench

      - name: Build omnigraph-server
        run: cargo build --release --locked -p omnigraph-server

      # The CLI has no `--version` flag (`disable_version_flag`); `version` is
      # its subcommand. The harness takes the flag. The server has neither and
      # serves only from a cluster, so `--help` is the call that starts it.
      - name: Check the binaries start
        shell: bash
        run: |
          set -euo pipefail
          target/release/omnigraph version
          target/release/omnigraph-bench --version
          target/release/omnigraph-server --help > /dev/null

      # The artifact is named by SOURCE_SHA, and the harness records nothing
      # unless it was compiled from a whole commit and a clean tree. Its long
      # version names both, so the binary must agree with the artifact's name.
      - name: Check the harness was built from this commit
        shell: bash
        run: |
          set -euo pipefail
          version="$(target/release/omnigraph-bench --version)"
          echo "$version"
          grep -qx "source commit: $SOURCE_SHA" <<<"$version" \
            || { echo "::error::omnigraph-bench was not built from $SOURCE_SHA"; exit 1; }
          grep -qx "source tree dirty: false" <<<"$version" \
            || { echo "::error::omnigraph-bench was not built from a clean tree"; exit 1; }

      - name: Assemble the artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0755 target/release/omnigraph target/release/omnigraph-bench target/release/omnigraph-server dist/
          (cd dist && sha256sum omnigraph > omnigraph.sha256 && sha256sum omnigraph-bench > omnigraph-bench.sha256 && sha256sum omnigraph-server > omnigraph-server.sha256)
          tar -czf dist/benchmarks.tar.gz benchmarks
          python3 - dist/build.json <<'PY'
          import json, os, subprocess, sys, time
          def line(argv):
              return subprocess.run(argv, capture_output=True, text=True, check=True).stdout.splitlines()[0].strip()
          os_release = dict(l.split("=", 1) for l in open("/etc/os-release") if "=" in l)
          json.dump({
              "version": 1,
              "commit": os.environ["SOURCE_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "rustc": line(["rustc", "--version"]),
              "cargo": line(["cargo", "--version"]),
              "target": "aarch64-unknown-linux-gnu",
              "rustflags": os.environ.get("RUSTFLAGS", ""),
              "os_release": os_release.get("PRETTY_NAME", "").strip().strip('"'),
              "glibc": line(["ldd", "--version"]),
              "runner": {"os": os.environ.get("RUNNER_OS", ""), "arch": os.environ.get("RUNNER_ARCH", "")},
              "workflow_run": {"id": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"]},
              "built_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }, open(sys.argv[1], "w"), indent=1, sort_keys=True)
          PY
          ls -l dist

      - name: Upload bench-binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-binaries-${{ env.SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  # The artifact, started the way the lab's campaign machine starts it. That
  # machine holds no checkout, no `git` and no toolchain: it installs
  # `awscli-2`, `tar`, `gzip` and `python3`, takes the artifact's files and
  # runs `omnigraph-bench run <suite> --catalog <dir> --store <store> --at
  # <sha>=<path>`, with `--server-product` for a served suite, then `report`.
  # This job holds the same and no more (the AWS CLI left out: nothing here
  # talks to AWS), so a step of the harness that needs a developer's machine
  # fails here first, not on a launched machine.
  #
  # The harness measures only on a disk it has proved: on Linux, XFS on EC2
  # instance-store NVMe. A GitHub runner has none, so a run here ends where
  # the harness refuses the disk. That is after it resolved the refs, read
  # each product's own `version --json`, found the server beside the product
  # and checked the scenario's options, and before it builds a base. The job
  # accepts that refusal, or a completed run with its row in the report, and
  # nothing else.
  harness_from_artifact:
    name: Run omnigraph-bench from the artifact alone (arm64, AL2023)
    needs: build
    runs-on: ubuntu-24.04-arm
    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # The machine's work directory; here a directory of the container.
      WORK: /mnt/campaign
    steps:
      - name: Install what the lab's machine installs
        run: dnf install -y -q tar gzip python3

      - name: Download bench-binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-binaries-${{ env.SOURCE_SHA }}
          path: artifact

      # As the machine places them: each binary beside its digest, which it
      # must match, the harness apart from the product it measures and the
      # server beside that product; the catalog unpacked without its top
      # directory. An image that gains `git` or `cargo` would hide the very
      # step this job exists to show, so either one fails it.
      - name: Lay the artifact out as the machine does
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SOURCE_SHA must be a full commit id"; exit 1; }
          for tool in git cargo; do
            if command -v "$tool" > /dev/null; then
              echo "::error::$tool is installed in this container; the lab's machine has none"
              exit 1
            fi
          done
          ls -l artifact
          mkdir -p "$WORK/bin/harness" "$WORK/bin/candidate" "$WORK/catalogs/public" "$WORK/store" "$WORK/results"
          place() {
            local role=$1 name=$2
            cp "artifact/$name" "artifact/$name.sha256" "$WORK/bin/$role/"
            (cd "$WORK/bin/$role" && sha256sum --check --quiet "$name.sha256")
            chmod 0755 "$WORK/bin/$role/$name"
          }
          place harness omnigraph-bench
          place candidate omnigraph
          place candidate omnigraph-server
          tar -xzf artifact/benchmarks.tar.gz -C "$WORK/catalogs/public" --strip-components=1
          test -f "$WORK/catalogs/public/benchmarks.yaml"

      # The build job starts them where the build's packages are installed;
      # here a binary that needs a library of that container does not start.
      - name: Check the binaries start
        shell: bash
        run: |
          set -euo pipefail
          "$WORK/bin/candidate/omnigraph" version
          "$WORK/bin/harness/omnigraph-bench" --version
          "$WORK/bin/candidate/omnigraph-server" --help > /dev/null

      # The machine's environment and no other: the PATH and LANG its
      # cloud-init hands the campaign, and the HOME the campaign sets. The
      # working directory, the store and the dataset cache are the campaign's.
      # `tiny-read` measures one query over two rows; `concurrency` is the
      # suite a served campaign runs. Every exit is kept for the next step to
      # judge.
      - name: Run the harness as the machine does
        shell: bash
        run: |
          set -euo pipefail
          machine=(env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin LANG=C.UTF-8 HOME=/root)
          bench="$WORK/bin/harness/omnigraph-bench"
          catalog=(--catalog "$WORK/catalogs/public")
          cd "$WORK"
          measure() {
            local name=$1 selection=$2 code=0
            shift 2
            "${machine[@]}" "$bench" run "$selection" "${catalog[@]}" --store "$WORK/store" \
              --dataset-cache "$WORK/datasets" --at "$SOURCE_SHA=$WORK/bin/candidate/omnigraph" "$@" --json \
              > "results/$name.json" 2> "results/$name-stderr.log" || code=$?
            echo "$code" > "results/$name.exit"
            echo "$name: run $selection exited $code"
          }
          report() {
            local selection=$1 code=0
            "${machine[@]}" "$bench" report "$selection" "${catalog[@]}" --store "$WORK/store" --json \
              > "results/report-$selection.json" 2> "results/report-$selection-stderr.log" || code=$?
            echo "$code" > "results/report-$selection.exit"
            echo "report $selection exited $code"
          }
          measure run tiny-read
          report tiny-read
          measure served concurrency --server-product
          report concurrency
          for file in results/*; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done

      # A run may end two ways. It measured, and the report then has its row.
      # Or the harness refused the disk, the furthest a run gets on this
      # runner. Any other end is a step that needs more than the artifact,
      # named here by the harness's own diagnostic.
      - name: Hold each run to its end
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$WORK/results" <<'PY'
          import json, pathlib, re, sys

          results = pathlib.Path(sys.argv[1])
          # What the disk probe says of a path that is on no XFS mount.
          DISK = re.compile(r"scratch device \d+:\d+ is not XFS|could not locate XFS scratch device \d+:\d+ in mountinfo")

          def document(name):
              try:
                  value = json.loads((results / f"{name}.json").read_text())
              except (OSError, ValueError) as error:
                  value = str(error)
              return value if isinstance(value, dict) else {"error": {"code": "unreadable", "message": f"{name}.json: {value}"}}

          def exit_code(name):
              return int((results / f"{name}.exit").read_text())

          def end(name, selection):
              """None when the run ended as it may, else what ended it."""
              run, report = document(name), document(f"report-{selection}")
              if exit_code(f"report-{selection}") != 0 or not isinstance(report.get("groups"), list):
                  return f"the report of {selection} did not read the store"
              rows = sum(len(group.get("rows") or []) for group in report["groups"])
              if exit_code(name) == 0:
                  if not rows:
                      return f"{selection} exited 0 and the report has no row of it"
                  print(f"{name}: {selection} measured, {rows} row(s) in the report")
                  return None
              error = run.get("error") or {}
              if error.get("code") == "gqt_prepare_failed" and DISK.search(str(error.get("message"))):
                  print(f"{name}: {selection} reached the disk probe and stopped there: {error['message']}")
                  return None
              said = [f"{d.get('code')} {d.get('path')}: {d.get('message')}" for d in run.get("diagnostics") or []]
              said = said or [f"{error.get('code')}: {error.get('message')}"]
              return f"{selection} stopped before the disk probe: " + "; ".join(said)

          failed = False
          for name, selection in (("run", "tiny-read"), ("served", "concurrency")):
              why = end(name, selection)
              if why:
                  failed = True
                  print(f"::error::{name}: {why}")
          sys.exit(1 if failed else 0)
          PY
