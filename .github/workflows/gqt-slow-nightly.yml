# Its own workflow, not a job in `dst-nightly.yml`: that workflow sets the
# pool-quiescing variables for every job, and the GQT runner refuses them as
# ambient. The tier's policy: `crates/omnigraph-gqt/README.md`, Slow cases.
name: GQT slow nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  gqt-slow:
    name: GQT slow cases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # Same floor as the GQ Logic Tests jobs: unoptimized builds keep every
      # nested async engine frame, deeper than a default 2 MiB thread stack.
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev mold

      - name: Install pinned toolchain
        run: rustup toolchain install

      # Its own cache: a rust-cache key carries the job, so the `GQT (dst)`
      # cache is not restorable here. Saved every night, red or green.
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
          key: gqt-slow
          cache-on-failure: true

      # The binary takes a directory and runs every `.gqt` under it in order,
      # one at a time, admitting `timeout_ms` above the required corpus's cap.
      - name: Run the slow cases
        run: cargo run -p omnigraph-gqt --locked --bin omnigraph-gqt -- crates/omnigraph-gqt/cases_slow

      # The generated laws at nightly breadth (docs/dev/testing.md, Generated
      # laws), enrolled by exact name; a name that did not run and pass fails.
      - name: Run the generated laws at nightly breadth
        run: |
          set -euo pipefail
          names=(
            law_engine_reference::engine_equals_reference_on_generated_reads_at_nightly_breadth
            law_scalar_evaluators::scalar_evaluators_agree_on_generated_expressions_at_nightly_breadth
          )
          cargo test -p omnigraph-gqt --locked --test integration -- --ignored --exact "${names[@]}" 2>&1 | tee target/gqt-laws.log
          for name in "${names[@]}"; do
            grep -Fx "test $name ... ok" target/gqt-laws.log
          done

      # Every direct-engine case under all four physical layouts (the gate
      # runs a and b); crates/omnigraph-gqt/README.md, Physical layouts.
      - name: Run every case under each physical layout
        env:
          OMNIGRAPH_GQT_LAYOUTS: a,b,c,d
        run: cargo test -p omnigraph-gqt --locked --test gq_layout_tests

      - name: Validate full benchmark datasets
        run: |
          cargo run -p omnigraph-gqt --locked --bin omnigraph-gqt -- \
            benchmarks/fixtures/branch_merge_d50.gqt \
            benchmarks/fixtures/branch_merge_d50_history64.gqt \
            benchmarks/fixtures/equal_current_narrow_one_batch.gqt \
            benchmarks/fixtures/equal_current_wide_four_batches.gqt \
            benchmarks/fixtures/equal_current_wide_one_batch.gqt \
            benchmarks/fixtures/hot_table_idle_base.gqt \
            benchmarks/fixtures/hot_table_idle_branches_4.gqt \
            benchmarks/fixtures/hot_table_idle_branches_4_aged.gqt \
            benchmarks/fixtures/hot_table_idle_tables_4.gqt \
            benchmarks/fixtures/identity_lifecycle.gqt \
            benchmarks/fixtures/nearest_ranks_updated_embedding.gqt \
            benchmarks/fixtures/nearest_skips_deleted_rows_and_fills_limit.gqt \
            benchmarks/fixtures/parallel_tables.gqt \
            benchmarks/fixtures/repeated_deletion_recreation_branches.gqt \
            benchmarks/fixtures/repeated_deletion_recreation_rows.gqt \
            benchmarks/fixtures/threshold_crossings_after.gqt \
            benchmarks/fixtures/threshold_crossings_at.gqt \
            benchmarks/fixtures/threshold_crossings_before.gqt \
            benchmarks/fixtures/threshold_crossings_production_control.gqt \
            benchmarks/fixtures/tiny_graph.gqt \
            benchmarks/fixtures/very_long_history_32.gqt

      - name: Retain GQT invocation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gqt-slow-invocation-reports
          path: target/gqt-artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
