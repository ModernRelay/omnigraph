# Its own workflow, not a job in `dst-nightly.yml`: that workflow sets the
# pool-quiescing variables for every job, and the GQT runner refuses them as
# ambient. The tier's policy: `crates/omnigraph-gqt/README.md`, Slow cases.
name: GQT slow nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  gqt-slow:
    name: GQT slow cases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # Same floor as the GQ Logic Tests jobs: unoptimized builds keep every
      # nested async engine frame, deeper than a default 2 MiB thread stack.
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install pinned toolchain
        run: rustup toolchain install

      # Its own cache: a rust-cache key carries the job, so the `GQT (dst)`
      # cache is not restorable here. Saved every night, red or green.
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
          key: gqt-slow
          cache-on-failure: true

      # The binary takes a directory and runs every `.gqt` under it in order,
      # one at a time, admitting `timeout_ms` above the required corpus's cap.
      - name: Run the slow cases
        run: cargo run -p omnigraph-gqt --locked --bin omnigraph-gqt -- crates/omnigraph-gqt/cases_slow

      - name: Retain GQT invocation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gqt-slow-invocation-reports
          path: target/gqt-artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
