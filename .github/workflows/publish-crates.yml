name: Publish to crates.io

# Dormant crates.io publication workflow. Registry publication is paused while
# the project recovers ownership of the historical `omnigraph-*` crate names;
# the first step below fail-closes every invocation until that policy and
# `docs/dev/versioning.md` are deliberately changed together.
#
# Automatic publication is called by CI only after the exact commit passes the
# vocabulary audit. Manual backfills require a prior exact-commit audit too.
#
# Once publication is restored, each crate's current crates.io version is
# checked before publish so a partial failure can be rerun idempotently.
#
# Prerequisite: repo secret CARGO_REGISTRY_TOKEN. The job exits cleanly if absent.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.4.1). Required for manual dispatches."
        required: true
        type: string

jobs:
  vocabulary_gate:
    name: Require audited crate source
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-vocabulary-gate.yml
    with:
      source_ref: ${{ inputs.source_ref || format('refs/tags/{0}', inputs.tag) }}
      ci_run_id: ${{ inputs.ci_run_id || '' }}

  publish_crates:
    name: Publish crates
    needs: vocabulary_gate
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ needs.vocabulary_gate.outputs.source_sha }}
    steps:
      - name: Enforce registry publication pause
        run: |
          echo "crates.io publication is paused while historical package ownership is unavailable."
          echo "CARGO_PUBLISH_SKIP=1" >> "$GITHUB_ENV"

      - name: Skip if CARGO_REGISTRY_TOKEN is not configured
        if: env.CARGO_PUBLISH_SKIP != '1' && env.CARGO_REGISTRY_TOKEN == ''
        run: |
          echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish."
          echo "CARGO_PUBLISH_SKIP=1" >> "$GITHUB_ENV"

      - name: Checkout source at tag
        if: env.CARGO_PUBLISH_SKIP != '1'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}

      # Defense in depth for a future publication restart: crates.io rejects git
      # dependencies, so a rev-pinned substrate must still defer that release.
      - name: Skip while the storage substrate is git-pinned
        if: env.CARGO_PUBLISH_SKIP != '1'
        run: |
          if grep -qE '^lance = \{ git' Cargo.toml; then
            echo "lance is git-pinned (pre-release substrate); deferring crates.io publish for this tag."
            echo "CARGO_PUBLISH_SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Install Linux dependencies
        if: env.CARGO_PUBLISH_SKIP != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install Rust stable
        if: env.CARGO_PUBLISH_SKIP != '1'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build data
        if: env.CARGO_PUBLISH_SKIP != '1'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target

      - name: Verify release tag still selects audited source
        if: env.CARGO_PUBLISH_SKIP != '1'
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]]
          refs="$(git ls-remote origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          tag_sha="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<<"$refs")"
          if [[ -z "$tag_sha" ]]; then
            tag_sha="$(awk 'NR == 1 {print $1}' <<<"$refs")"
          fi
          [[ "$tag_sha" == "$SOURCE_SHA" ]] || {
            echo "::error::${RELEASE_TAG} now selects ${tag_sha:-nothing}, expected ${SOURCE_SHA}"
            exit 1
          }

      - name: Publish crates in dependency order
        if: env.CARGO_PUBLISH_SKIP != '1'
        run: |
          set -euo pipefail

          publish_if_new() {
            local crate="$1"
            local version
            version=$(cargo metadata --format-version=1 --no-deps \
              | jq -r --arg c "$crate" '.packages[] | select(.name==$c) | .version')

            # crates.io API requires a User-Agent header — without it the
            # API responds 403 and the skip check below would silently
            # fall through to a real publish attempt that errors with
            # "already exists on crates.io index" when re-running after a
            # partial publish. Send a UA naming the workflow.
            local current
            current=$(curl -fsSL \
              -A 'ModernRelay-omnigraph-ci (https://github.com/ModernRelay/omnigraph)' \
              "https://crates.io/api/v1/crates/${crate}" \
              | jq -r '.crate.max_version' || echo "")

            if [[ "$current" == "$version" ]]; then
              echo "==> ${crate} ${version} already on crates.io, skipping"
              return 0
            fi

            echo "==> publishing ${crate} ${version} (current crates.io: ${current:-none})"
            # Defense in depth: if the skip check missed an existing
            # version (e.g. crates.io API hiccup), cargo publish errors
            # with "already exists on crates.io index". Treat that as
            # success so the workflow can be re-run idempotently.
            local output
            if ! output=$(cargo publish -p "$crate" --locked 2>&1); then
              echo "$output"
              if echo "$output" | grep -q "already exists on crates.io"; then
                echo "==> ${crate} ${version} was already published; treating as success"
                return 0
              fi
              return 1
            fi
            echo "$output"
          }

          # Order matters: each crate must precede anything that depends on it.
          # omnigraph-compiler, omnigraph-policy, and omnigraph-storage have no
          # internal deps; omnigraph-engine depends on those leaves;
          # omnigraph-api-types and omnigraph-cluster depend on engine
          # (+ compiler); server depends on engine + api-types + cluster; cli
          # depends on everything above it.
          publish_if_new omnigraph-compiler
          publish_if_new omnigraph-policy
          publish_if_new omnigraph-storage
          publish_if_new omnigraph-engine
          publish_if_new omnigraph-api-types
          publish_if_new omnigraph-cluster
          publish_if_new omnigraph-server
          publish_if_new omnigraph-cli
