name: Release

# Build per-platform binaries in a matrix, then publish the GitHub release ONCE
# from a single job. The matrix used to call `softprops/action-gh-release`
# concurrently — three jobs racing to create/finalize the same release, which
# exhausted the action's finalize retries and dropped whole platforms' assets.
# The matrix now only uploads workflow artifacts; `publish_release` is the sole
# writer of the release (no race).
#
# Automatic tag releases are called by CI only after the exact commit passes
# the vocabulary audit. Manual backfills retain the same gate and fail closed
# when the selected tag has no successful audit.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish (e.g. v0.7.0). Required for manual dispatches."
        required: true
        type: string

jobs:
  vocabulary_gate:
    name: Require audited release source
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-vocabulary-gate.yml
    with:
      source_ref: ${{ inputs.source_ref || format('refs/tags/{0}', inputs.tag) }}
      ci_run_id: ${{ inputs.ci_run_id || '' }}

  build_release:
    name: Build ${{ matrix.asset_name }}
    needs: vocabulary_gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_name: omnigraph-linux-x86_64
          - runner: ubuntu-24.04-arm
            asset_name: omnigraph-linux-arm64
          - runner: macos-14
            asset_name: omnigraph-macos-arm64
            # OmniGraph's release text exceeds arm64's +/-128 MiB direct-branch
            # range. Use long calls instead of relying on ld branch islands.
            rustflags: -C code-model=large
          - runner: windows-latest
            asset_name: omnigraph-windows-x86_64
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target

      - name: Build release binaries
        run: cargo build --release --locked -p omnigraph-cli -p omnigraph-server -p omnigraph-azure-admission

      - name: Package Unix release archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          install -m 0755 target/release/omnigraph release/omnigraph
          install -m 0755 target/release/omnigraph-server release/omnigraph-server
          install -m 0755 target/release/omnigraph-azure-admission release/omnigraph-azure-admission
          tar -C release -czf "${{ matrix.asset_name }}.tar.gz" omnigraph omnigraph-server omnigraph-azure-admission
          shasum -a 256 "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.sha256"

      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/release/omnigraph.exe release/omnigraph.exe
          Copy-Item target/release/omnigraph-server.exe release/omnigraph-server.exe
          Copy-Item target/release/omnigraph-azure-admission.exe release/omnigraph-azure-admission.exe
          Compress-Archive -Path release/omnigraph.exe, release/omnigraph-server.exe, release/omnigraph-azure-admission.exe -DestinationPath "${{ matrix.asset_name }}.zip" -Force
          $hash = (Get-FileHash "${{ matrix.asset_name }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path (Get-Location) "${{ matrix.asset_name }}.sha256"
          [System.IO.File]::WriteAllText(
            $checksumPath,
            "$hash  ${{ matrix.asset_name }}.zip`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          $checksumBytes = [System.IO.File]::ReadAllBytes($checksumPath)
          if ($checksumBytes -contains 13) {
            throw "Windows checksum manifest contains CR; expected LF-only"
          }
          New-Item -ItemType Directory -Force -Path verify | Out-Null
          Expand-Archive -Path "${{ matrix.asset_name }}.zip" -DestinationPath verify -Force
          $items = Get-ChildItem -Path verify -File
          if ($items.Count -ne 3 -or !(Test-Path verify/omnigraph.exe) -or !(Test-Path verify/omnigraph-server.exe) -or !(Test-Path verify/omnigraph-azure-admission.exe)) {
            throw "Windows release archive is missing expected binaries"
          }

      # Upload artifacts only — the single `publish_release` job attaches them to
      # the release, so no two jobs ever write the release concurrently.
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.*
          if-no-files-found: error
          retention-days: 1

  publish_release:
    name: Publish GitHub release
    needs: [vocabulary_gate, build_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout audited source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify release tag still selects audited source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.vocabulary_gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]]
          refs="$(git ls-remote origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          tag_sha="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<<"$refs")"
          if [[ -z "$tag_sha" ]]; then
            tag_sha="$(awk 'NR == 1 {print $1}' <<<"$refs")"
          fi
          [[ "$tag_sha" == "$SOURCE_SHA" ]] || {
            echo "::error::${RELEASE_TAG} now selects ${tag_sha:-nothing}, expected ${SOURCE_SHA}"
            exit 1
          }

      - name: Download release build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-omnigraph-*
          path: dist
          merge-multiple: true

      - name: Verify exact release artifact set
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              "omnigraph-linux-arm64.sha256",
              "omnigraph-linux-arm64.tar.gz",
              "omnigraph-linux-x86_64.sha256",
              "omnigraph-linux-x86_64.tar.gz",
              "omnigraph-macos-arm64.sha256",
              "omnigraph-macos-arm64.tar.gz",
              "omnigraph-windows-x86_64.sha256",
              "omnigraph-windows-x86_64.zip",
          }
          actual = {
              str(path.relative_to("dist"))
              for path in Path("dist").rglob("*")
              if path.is_file()
          }
          if actual != expected:
              missing = sorted(expected - actual)
              unexpected = sorted(actual - expected)
              raise SystemExit(
                  f"invalid release artifact set: missing={missing}, unexpected={unexpected}"
              )
          PY


      - name: Verify checksum manifests are Unix-portable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path("dist").glob("*.sha256")):
              data = path.read_bytes()
              if b"\r" in data:
                  raise SystemExit(f"{path} contains CR; checksums must be LF-only")
          PY
          cd dist
          sha256sum --strict -c *.sha256

      - name: Publish release (single writer — no matrix race)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/**
          overwrite_files: true

  update_homebrew_tap:
    name: Update Homebrew tap
    needs: [vocabulary_gate, publish_release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Skip if HOMEBREW_TAP_TOKEN is not configured
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update."
          echo "HOMEBREW_TAP_SKIP=1" >> "$GITHUB_ENV"

      - name: Checkout source
        if: env.HOMEBREW_TAP_SKIP != '1'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}

      - name: Checkout Homebrew tap
        if: env.HOMEBREW_TAP_SKIP != '1'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ModernRelay/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula from release assets
        if: env.HOMEBREW_TAP_SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/update-homebrew-formula.sh "${RELEASE_TAG}" homebrew-tap/Formula/omnigraph.rb

      # Diagnostic only: brew is not on PATH on the ubuntu runner by default, so
      # set it up explicitly. Both this setup and the audit below are best-effort
      # canaries, not gates — continue-on-error on each keeps a failed/flaky brew
      # from skipping the actual tap publish below. The formula is correct by
      # construction (update-homebrew-formula.sh), so brew tooling must never
      # block the push.
      - name: Set up Homebrew
        if: env.HOMEBREW_TAP_SKIP != '1'
        continue-on-error: true
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # master

      - name: Audit generated formula
        if: env.HOMEBREW_TAP_SKIP != '1'
        continue-on-error: true
        run: |
          # Audit the checked-out tap by name (brew audit rejects bare paths
          # and needs tap context). Symlink the checkout into Homebrew's Taps
          # tree so `modernrelay/tap/omnigraph` resolves to it. Offline audit
          # (no --online) keeps it deterministic; it still catches the
          # ComponentsOrder/structure class of problems.
          tap_dir="$(brew --repository)/Library/Taps/modernrelay/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$PWD/homebrew-tap" "$tap_dir"
          brew audit --strict modernrelay/tap/omnigraph

      - name: Commit and push formula update
        if: env.HOMEBREW_TAP_SKIP != '1'
        working-directory: homebrew-tap
        run: |
          if git diff --quiet -- Formula/omnigraph.rb; then
            echo "Formula already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/omnigraph.rb
          git commit -m "Update Omnigraph formula to ${RELEASE_TAG}"
          git push origin HEAD:main

  smoke_windows_installer:
    name: Smoke Windows installer
    needs: [vocabulary_gate, publish_release]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}

      - name: Install from tagged release
        run: ./scripts/install.ps1 -Version "$env:RELEASE_TAG" -InstallDir "$env:RUNNER_TEMP/omnigraph-bin"

      - name: Smoke installed binaries
        run: |
          & "$env:RUNNER_TEMP/omnigraph-bin/omnigraph.exe" version
          & "$env:RUNNER_TEMP/omnigraph-bin/omnigraph-server.exe" --help
          & "$env:RUNNER_TEMP/omnigraph-bin/omnigraph-azure-admission.exe" --help
