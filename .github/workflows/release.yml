name: Release

# Build per-platform binaries in a matrix, then publish the GitHub release ONCE
# from a single job. The matrix used to call `softprops/action-gh-release`
# concurrently — three jobs racing to create/finalize the same release, which
# exhausted the action's finalize retries and dropped whole platforms' assets.
# The matrix (`build-release-archives.yml`, shared with edge releases) now only
# uploads workflow artifacts; `publish_release` is the sole writer of the
# release (no race).
#
# Automatic tag releases are called by CI only after the exact commit passes
# the vocabulary audit. Manual backfills retain the same gate and fail closed
# when the selected tag has no successful audit.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish (e.g. v0.7.0). Required for manual dispatches."
        required: true
        type: string

jobs:
  vocabulary_gate:
    name: Require audited release source
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-vocabulary-gate.yml
    with:
      source_ref: ${{ inputs.source_ref || format('refs/tags/{0}', inputs.tag) }}
      ci_run_id: ${{ inputs.ci_run_id || '' }}

  # Releases before v0.14.0 predate the commit and channel stamp and release
  # attestations; a manual backfill of one checks that its archives run, not
  # what they report, and may publish without provenance.
  release_source:
    name: Classify release source
    needs: vocabulary_gate
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      check_stamp: ${{ steps.classify.outputs.check_stamp }}
    steps:
      - name: Classify release tag
        id: classify
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if not match:
              raise SystemExit("stable release tags must use vMAJOR.MINOR.PATCH")
          stamped = tuple(map(int, match.groups())) >= (0, 14, 0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              print(f"check_stamp={'true' if stamped else 'false'}", file=outputs)
          PY

  build_release:
    name: Build release archives
    needs: [vocabulary_gate, release_source]
    permissions:
      contents: read
    uses: ./.github/workflows/build-release-archives.yml
    with:
      source_sha: ${{ needs.vocabulary_gate.outputs.source_sha }}
      channel: stable
      check_stamp: ${{ needs.release_source.outputs.check_stamp == 'true' }}

  publish_release:
    name: Publish GitHub release
    needs: [vocabulary_gate, release_source, build_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout audited source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}
          # Validate the input manifest against the audited source and release base.
          fetch-depth: 0

      - name: Verify release tag still selects audited source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.vocabulary_gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]]
          refs="$(git ls-remote origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          tag_sha="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<<"$refs")"
          if [[ -z "$tag_sha" ]]; then
            tag_sha="$(awk 'NR == 1 {print $1}' <<<"$refs")"
          fi
          [[ "$tag_sha" == "$SOURCE_SHA" ]] || {
            echo "::error::${RELEASE_TAG} now selects ${tag_sha:-nothing}, expected ${SOURCE_SHA}"
            exit 1
          }

      - name: Download release build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-omnigraph-*
          path: dist
          merge-multiple: true

      # The provenance predicate names the run's commit (its OIDC `sha`
      # claim), not the checkout. A tag push runs at the tagged commit; a
      # manual backfill attests only when dispatched at the tag itself.
      - name: Require the run's commit to be the built commit
        id: provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.vocabulary_gate.outputs.source_sha }}
          REQUIRE_ATTESTATION: ${{ needs.release_source.outputs.check_stamp }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]; then
            echo "attest=true" >> "$GITHUB_OUTPUT"
          elif [[ "$REQUIRE_ATTESTATION" == true ]]; then
            echo "::error::this run is for ${GITHUB_SHA}, not ${RELEASE_TAG} (${SOURCE_SHA}); dispatch the backfill at refs/tags/${RELEASE_TAG} so its provenance names the built commit"
            exit 1
          else
            echo "::warning::${RELEASE_TAG} predates release attestations and this run is for ${GITHUB_SHA}; publishing without provenance"
            echo "attest=false" >> "$GITHUB_OUTPUT"
          fi

      # `build-release-archives.yml` verified this exact set and its checksums.
      - name: Attest build provenance
        if: steps.provenance.outputs.attest == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Validate and prepare release notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.vocabulary_gate.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if not match:
              raise SystemExit("stable release tags must use vMAJOR.MINOR.PATCH")
          if tuple(map(int, match.groups())) < (0, 12, 0):
              # Older audited checkouts do not contain the release-note tool.
              raise SystemExit(0)
          environment = Path(os.environ["RUNNER_TEMP"]) / "release-notes-venv"
          subprocess.run([sys.executable, "-m", "venv", str(environment)], check=True)
          python = str(environment / "bin/python")
          subprocess.run(
              [python, "-m", "pip", "install", "--disable-pip-version-check",
               "-r", "scripts/requirements-docs.txt"], check=True,
          )
          output = Path(os.environ["RUNNER_TEMP"]) / "release-notes-body.md"
          with output.open("w", encoding="utf-8") as body:
              subprocess.run(
                  [python, "scripts/release_notes.py", "body", "--tag", tag,
                   "--target", os.environ["SOURCE_SHA"]],
                  stdout=body, check=True,
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              print(f"body_path={output}", file=outputs)
          PY

      - name: Publish release (single writer — no matrix race)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
          files: dist/**
          overwrite_files: true

  update_homebrew_tap:
    name: Update Homebrew tap
    needs: [vocabulary_gate, publish_release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Skip if HOMEBREW_TAP_TOKEN is not configured
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update."
          echo "HOMEBREW_TAP_SKIP=1" >> "$GITHUB_ENV"

      - name: Checkout source
        if: env.HOMEBREW_TAP_SKIP != '1'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}

      - name: Checkout Homebrew tap
        if: env.HOMEBREW_TAP_SKIP != '1'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ModernRelay/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula from release assets
        if: env.HOMEBREW_TAP_SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/update-homebrew-formula.sh "${RELEASE_TAG}" homebrew-tap/Formula/omnigraph.rb

      # Diagnostic only: brew is not on PATH on the ubuntu runner by default, so
      # set it up explicitly. Both this setup and the audit below are best-effort
      # canaries, not gates — continue-on-error on each keeps a failed/flaky brew
      # from skipping the actual tap publish below. The formula is correct by
      # construction (update-homebrew-formula.sh), so brew tooling must never
      # block the push.
      - name: Set up Homebrew
        if: env.HOMEBREW_TAP_SKIP != '1'
        continue-on-error: true
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # master

      - name: Audit generated formula
        if: env.HOMEBREW_TAP_SKIP != '1'
        continue-on-error: true
        run: |
          # Audit the checked-out tap by name (brew audit rejects bare paths
          # and needs tap context). Symlink the checkout into Homebrew's Taps
          # tree so `modernrelay/tap/omnigraph` resolves to it. Offline audit
          # (no --online) keeps it deterministic; it still catches the
          # ComponentsOrder/structure class of problems.
          tap_dir="$(brew --repository)/Library/Taps/modernrelay/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$PWD/homebrew-tap" "$tap_dir"
          brew audit --strict modernrelay/tap/omnigraph

      - name: Commit and push formula update
        if: env.HOMEBREW_TAP_SKIP != '1'
        working-directory: homebrew-tap
        run: |
          if git diff --quiet -- Formula/omnigraph.rb; then
            echo "Formula already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/omnigraph.rb
          git commit -m "Update Omnigraph formula to ${RELEASE_TAG}"
          git push origin HEAD:main

  smoke_installers:
    name: Smoke ${{ matrix.runner }} installer
    needs: [vocabulary_gate, release_source, publish_release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ needs.vocabulary_gate.outputs.source_sha }}
      CHECK_STAMP: ${{ needs.release_source.outputs.check_stamp }}
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}
          persist-credentials: false

      - name: Install from tagged release
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/omnigraph-bin"
          VERSION="$RELEASE_TAG" INSTALL_DIR="$dir" bash scripts/install.sh
          if [[ "$CHECK_STAMP" == true ]]; then
            "$dir/omnigraph" version
            "$dir/omnigraph" version --json > "$RUNNER_TEMP/version.json"
            python3 - "$RUNNER_TEMP/version.json" <<'PY'
          import json, os, sys
          facts = json.load(open(sys.argv[1]))
          expected = ("stable", os.environ["SOURCE_SHA"])
          if (facts["channel"], facts["commit"]) != expected:
              raise SystemExit(f"installed {facts['channel']}/{facts['commit']}, expected {expected}")
          PY
          else
            "$dir/omnigraph" --help > /dev/null
          fi
          "$dir/omnigraph-server" --help > /dev/null
          "$dir/omnigraph-azure-admission" --help > /dev/null

      - name: Install from tagged release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP/omnigraph-bin"
          ./scripts/install.ps1 -Version "$env:RELEASE_TAG" -InstallDir $dir
          if ($env:CHECK_STAMP -eq "true") {
            & "$dir/omnigraph.exe" version
            $facts = & "$dir/omnigraph.exe" version --json | Out-String | ConvertFrom-Json
            if ($facts.channel -ne "stable" -or $facts.commit -ne $env:SOURCE_SHA) {
              throw "installed $($facts.channel)/$($facts.commit), expected stable/$env:SOURCE_SHA"
            }
          } else {
            & "$dir/omnigraph.exe" --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "omnigraph --help failed" }
          }
          & "$dir/omnigraph-server.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "omnigraph-server --help failed" }
          & "$dir/omnigraph-azure-admission.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "omnigraph-azure-admission --help failed" }
