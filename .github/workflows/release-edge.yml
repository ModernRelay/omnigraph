name: Release Edge

# Once a day, the tip of `main` is built and published twice once its whole
# CI run has passed, unless `edge` already holds it. A run builds only
# its own commit, the one its build provenance names. Its own
# prerelease, `edge-<commit date>-<short commit>`, never changes once
# published, so a deployment can pin it and roll back to it; the rolling `edge`
# release always holds the newest such build for the installers' edge
# channel. The build matrix only uploads workflow artifacts; the single
# `publish_edge_release` job writes both releases, after every archive is
# built, run on its platform and verified as a set. The rolling release only
# moves forward along `main`.

on:
  schedule:
    # Daily, off the hour that scheduled workflows crowd.
    - cron: "17 4 * * *"
  # Manual dispatch on `main` builds its tip now.
  workflow_dispatch:

# One run at a time, from publication through the installer checks of the
# rolling channel, so a newer build cannot move `edge` under an older run's
# smoke tests.
concurrency:
  group: release-edge
  cancel-in-progress: false

jobs:
  # Decided before the audit gate, which may wait for the commit's CI run.
  prepare_edge_release:
    name: Prepare edge release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.freshness.outputs.publish }}
      build_tag: ${{ steps.name.outputs.build_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          # Ancestry against main and the current edge build.
          fetch-depth: 0

      - name: Reject a source edge already holds
        id: freshness
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          current_edge="$(git ls-remote origin refs/tags/edge | awk '{print $1}')"
          git fetch --quiet --force --tags origin main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" "$current_main"; then
            echo "::notice::${SOURCE_SHA} is not on main (${current_main}); nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$current_edge" ]] && git merge-base --is-ancestor "$SOURCE_SHA" "$current_edge"; then
            echo "::notice::edge already holds ${current_edge}, which includes ${SOURCE_SHA}; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # An edge build of X.Y.Z reports X.Y.Z-edge+<commit>, which sorts before
      # X.Y.Z: refuse it until main's version is above the latest stable.
      - name: Refuse a version that sorts before the latest stable release
        if: steps.freshness.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/omnigraph-cli/Cargo.toml", "rb"))["package"]["version"])')"
          stable_tag="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          python3 scripts/edge_release.py check-version \
            --package-version "$package_version" --stable-tag "$stable_tag"

      # The commit's own date, not the run's, so a rerun names the same build.
      - name: Name the edge build
        id: name
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          day="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d "$SOURCE_SHA")"
          echo "build_tag=edge-${day}-${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"

  vocabulary_gate:
    name: Require audited edge source
    needs: prepare_edge_release
    if: needs.prepare_edge_release.outputs.publish == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-vocabulary-gate.yml
    with:
      source_ref: ${{ github.sha }}
      # A pinnable, attested build comes only from a commit whose whole CI
      # passed; its run may still be queued behind earlier runs on main.
      require_ci_gate: true
      wait_minutes: 180
      # A run cancelled because main moved on is not a failure; the next
      # scheduled run builds the newer commit.
      superseded_ok: true

  build_release:
    name: Build edge archives
    needs: [vocabulary_gate, prepare_edge_release]
    if: needs.prepare_edge_release.outputs.publish == 'true' && needs.vocabulary_gate.outputs.superseded != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-release-archives.yml
    with:
      source_sha: ${{ needs.vocabulary_gate.outputs.source_sha }}
      channel: edge
      check_stamp: true

  publish_edge_release:
    name: Publish edge release
    needs: [vocabulary_gate, prepare_edge_release, build_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      moved: ${{ steps.rolling.outputs.moved }}
    env:
      BUILD_TAG: ${{ needs.prepare_edge_release.outputs.build_tag }}
      SOURCE_SHA: ${{ needs.vocabulary_gate.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Edge builds kept as their own prereleases, besides the newest build of
      # each storage format; older ones are deleted.
      EDGE_BUILDS_RETAINED: "30"
    steps:
      - name: Checkout audited source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}
          # The rolling tag's ancestry and the release-note base need history.
          fetch-depth: 0

      - name: Download release build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-omnigraph-*
          path: dist
          merge-multiple: true

      # A rerun of a published build keeps its first archives: the build
      # release never changes once published, and the rolling release copies
      # its bytes. An earlier attempt's draft is removed first, because gh
      # resolves a tag to a draft or a published release, whichever answers
      # first; the by-tag REST lookup sees published releases only.
      - name: Check for an existing build release
        id: existing
        run: |
          set -euo pipefail
          [[ "$BUILD_TAG" =~ ^edge-[0-9]{8}-[0-9a-f]{7}$ && "$BUILD_TAG" == *"${SOURCE_SHA:0:7}" ]]
          tag_sha="$(git ls-remote origin "refs/tags/${BUILD_TAG}" | awk '{print $1}')"
          if [[ -n "$tag_sha" && "$tag_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::${BUILD_TAG} already names ${tag_sha}, not ${SOURCE_SHA}"
            exit 1
          fi
          for draft in $(gh api "repos/${GH_REPO}/releases" --paginate \
              --jq ".[] | select(.draft and .tag_name == \"${BUILD_TAG}\") | .id"); do
            gh api -X DELETE "repos/${GH_REPO}/releases/${draft}"
          done
          if gh api "repos/${GH_REPO}/releases/tags/${BUILD_TAG}" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # The provenance predicate names the run's commit (its OIDC `sha`
      # claim), not the checkout, so the two must be the same commit.
      - name: Require the run's commit to be the built commit
        run: |
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]] || {
            echo "::error::this run is for ${GITHUB_SHA} but built ${SOURCE_SHA}; its provenance would name the wrong commit"
            exit 1
          }

      - name: Attest build provenance
        if: steps.existing.outputs.published != 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Read this build's and the latest stable release's facts
        id: facts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edge-bin"
          tar -C "$RUNNER_TEMP/edge-bin" -xzf dist/omnigraph-linux-x86_64.tar.gz
          "$RUNNER_TEMP/edge-bin/omnigraph" version --json > "$RUNNER_TEMP/build-version.json"
          stable_tag="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ -n "$stable_tag" ]]; then
            [[ "$stable_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            VERSION="$stable_tag" INSTALL_DIR="$RUNNER_TEMP/stable-bin" bash scripts/install.sh
            # Releases before 0.14 print text only.
            "$RUNNER_TEMP/stable-bin/omnigraph" version --json > "$RUNNER_TEMP/stable-version.out" 2>/dev/null \
              || "$RUNNER_TEMP/stable-bin/omnigraph" version > "$RUNNER_TEMP/stable-version.out"
          fi
          echo "stable_tag=${stable_tag}" >> "$GITHUB_OUTPUT"

      - name: Compose release text
        env:
          STABLE_TAG: ${{ steps.facts.outputs.stable_tag }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/release-notes-venv"
          python="$RUNNER_TEMP/release-notes-venv/bin/python"
          "$python" -m pip install --disable-pip-version-check -r scripts/requirements-docs.txt
          "$python" scripts/release_notes.py preview --target "$SOURCE_SHA" > "$RUNNER_TEMP/notes.md"
          stable=()
          if [[ -n "$STABLE_TAG" ]]; then
            stable=(--stable-tag "$STABLE_TAG" --stable-version "$RUNNER_TEMP/stable-version.out")
          fi
          for kind in build rolling; do
            rolling=()
            [[ "$kind" == rolling ]] && rolling=(--rolling)
            python3 scripts/edge_release.py body \
              --repository "$GH_REPO" --commit "$SOURCE_SHA" --build-tag "$BUILD_TAG" \
              --build-version "$RUNNER_TEMP/build-version.json" --notes "$RUNNER_TEMP/notes.md" \
              "${stable[@]}" "${rolling[@]}" > "$RUNNER_TEMP/${kind}-body.md"
          done

      # The tag is pushed first, so the release never depends on GitHub
      # creating it; a draft is invisible until published, so the build
      # release appears with every archive or not at all.
      - name: Publish the build release
        if: steps.existing.outputs.published != 'true'
        run: |
          set -euo pipefail
          if [[ -z "$(git ls-remote origin "refs/tags/${BUILD_TAG}")" ]]; then
            git tag "$BUILD_TAG" "$SOURCE_SHA"
            git push origin "refs/tags/${BUILD_TAG}"
          fi
          gh release create "$BUILD_TAG" dist/* \
            --draft --prerelease --latest=false --verify-tag \
            --title "Edge ${BUILD_TAG}" \
            --notes-file "$RUNNER_TEMP/build-body.md"
          gh release edit "$BUILD_TAG" --draft=false

      - name: Verify the published build release
        run: |
          set -euo pipefail
          gh release download "$BUILD_TAG" --dir published
          python3 - <<'PY'
          from pathlib import Path

          expected = {path.name for path in Path("dist").iterdir()}
          actual = {path.name for path in Path("published").iterdir()}
          if actual != expected:
              raise SystemExit(f"{actual ^ expected} differ between the build release and this build")
          PY
          (cd published && sha256sum --strict -c ./*.sha256)
          tag_sha="$(git ls-remote origin "refs/tags/${BUILD_TAG}" | awk '{print $1}')"
          [[ "$tag_sha" == "$SOURCE_SHA" ]] || {
            echo "::error::${BUILD_TAG} names ${tag_sha:-nothing}, expected ${SOURCE_SHA}"
            exit 1
          }

      # Forward only: a build moves `edge` when the commit it holds is an
      # ancestor of this one and this one is still on `main`. The update is in
      # place, which the repository's immutable-releases setting would refuse.
      - name: Move the rolling edge release
        id: rolling
        run: |
          set -euo pipefail
          git fetch --quiet --force --tags origin main
          current="$(git ls-remote origin refs/tags/edge | awk '{print $1}')"
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "::notice::${SOURCE_SHA} is no longer on main; edge stays at ${current:-nothing}"
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$current" ]] && ! git merge-base --is-ancestor "$current" "$SOURCE_SHA"; then
            echo "::notice::edge already holds ${current}, which ${SOURCE_SHA} does not descend from"
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh release view edge > /dev/null 2>&1; then
            gh release create edge published/* --prerelease --latest=false \
              --target "$SOURCE_SHA" --title Edge --notes-file "$RUNNER_TEMP/rolling-body.md"
          else
            gh release upload edge published/* --clobber
            for asset in $(gh release view edge --json assets --jq '.assets[].name'); do
              if [[ ! -e "published/${asset}" ]]; then
                gh release delete-asset edge "$asset" --yes
              fi
            done
            gh release edit edge --title Edge --prerelease --notes-file "$RUNNER_TEMP/rolling-body.md"
          fi
          git tag -f edge "$SOURCE_SHA"
          git push origin refs/tags/edge --force
          echo "moved=true" >> "$GITHUB_OUTPUT"

      # The newest build of every storage format survives the count: it is the
      # build that can still export a graph at an abandoned development format.
      - name: Delete edge builds beyond the retained count
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/releases" --paginate \
            --jq '.[] | {tag_name, created_at, draft, body} | tojson' > "$RUNNER_TEMP/releases.jsonl"
          python3 scripts/edge_release.py prune --releases "$RUNNER_TEMP/releases.jsonl" \
            --retain "$EDGE_BUILDS_RETAINED" --current "$BUILD_TAG" > "$RUNNER_TEMP/edge-builds-to-delete.txt"
          while read -r tag; do
            [[ "$tag" =~ ^edge-[0-9]{8}-[0-9a-f]{7}$ && "$tag" != "$BUILD_TAG" ]]
            gh release delete "$tag" --cleanup-tag --yes
          done < "$RUNNER_TEMP/edge-builds-to-delete.txt"

  # The container image of the same build: the published build release's
  # Linux x86_64 archive, checked against its checksum and its attestation
  # (this workflow, this commit), on a trixie base because the archives need
  # glibc 2.39 or newer. Tagged like the release, `edge-<commit date>-<short
  # commit>`, which never changes once pushed, and `edge` only when the rolling
  # release moved; never `latest`.
  publish_edge_image:
    name: Publish edge image
    needs: [vocabulary_gate, prepare_edge_release, publish_edge_release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      BUILD_TAG: ${{ needs.prepare_edge_release.outputs.build_tag }}
      SOURCE_SHA: ${{ needs.vocabulary_gate.outputs.source_sha }}
      MOVED: ${{ needs.publish_edge_release.outputs.moved }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}
          persist-credentials: false

      # The provenance predicate names the run's commit (its OIDC `sha`
      # claim), so the image is attested only for the run's own commit.
      - name: Require the run's commit to be the built commit
        run: |
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]] || {
            echo "::error::this run is for ${GITHUB_SHA} but built ${SOURCE_SHA}; its provenance would name the wrong commit"
            exit 1
          }

      # `.dockerignore` admits only target/release/<binary>, the paths the
      # Dockerfile copies.
      - name: Take the build's Linux binaries from its release
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/archive"
          mkdir -p "$archive" target/release
          gh release download "$BUILD_TAG" --pattern 'omnigraph-linux-x86_64.*' --dir "$archive"
          (cd "$archive" && sha256sum --strict -c omnigraph-linux-x86_64.sha256)
          gh attestation verify "$archive/omnigraph-linux-x86_64.tar.gz" --repo "$GH_REPO" \
            --source-digest "$SOURCE_SHA" --signer-workflow "${GH_REPO}/.github/workflows/release-edge.yml"
          tar -C target/release -xzf "$archive/omnigraph-linux-x86_64.tar.gz"

      - name: Log in to GHCR
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      # A rerun keeps the image first pushed for this build and checks it again.
      - name: Build, check and push the build's image
        id: ghcr
        run: |
          set -euo pipefail
          # Only a definite "not found" means the tag is free; any other
          # registry answer stops the run rather than overwrite a pushed tag.
          image_exists() {
            local out
            if out="$(docker buildx imagetools inspect "$1" 2>&1)"; then
              return 0
            fi
            if grep -q ': not found' <<<"$out"; then
              return 1
            fi
            echo "::error::cannot tell whether $1 exists: ${out}"
            exit 1
          }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omnigraph-server"
          if image_exists "${image}:${BUILD_TAG}"; then
            docker pull "${image}:${BUILD_TAG}"
            pushed=false
          else
            docker build --build-arg BASE_IMAGE=public.ecr.aws/debian/debian:trixie-slim \
              -t "${image}:${BUILD_TAG}" .
            pushed=true
          fi
          docker run --rm --entrypoint /usr/local/bin/omnigraph "${image}:${BUILD_TAG}" version
          docker run --rm --entrypoint /usr/local/bin/omnigraph "${image}:${BUILD_TAG}" version --json \
            > "$RUNNER_TEMP/version.json"
          python3 - "$RUNNER_TEMP/version.json" <<'PY'
          import json, os, sys
          facts = json.load(open(sys.argv[1]))
          expected = ("edge", os.environ["SOURCE_SHA"])
          if (facts["channel"], facts["commit"]) != expected:
              raise SystemExit(f"image reports {facts['channel']}/{facts['commit']}, expected {expected}")
          PY
          docker run --rm --entrypoint /usr/local/bin/omnigraph-server "${image}:${BUILD_TAG}" --help > /dev/null
          docker run --rm --entrypoint /usr/local/bin/omnigraph-azure-admission "${image}:${BUILD_TAG}" --help > /dev/null
          if [[ "$pushed" == true ]]; then
            docker push "${image}:${BUILD_TAG}"
          fi
          digest="$(docker buildx imagetools inspect "${image}:${BUILD_TAG}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.ghcr.outputs.image }}
          subject-digest: ${{ steps.ghcr.outputs.digest }}
          push-to-registry: true

      # The `edge` image tag follows the rolling release as it is now, not as
      # this run left it: a rerun of an older run's failed job must not move it
      # back behind a newer build.
      - name: Decide whether the rolling edge image moves
        id: rolling
        run: |
          set -euo pipefail
          current_edge="$(git ls-remote origin refs/tags/edge | awk '{print $1}')"
          if [[ "$MOVED" == true && "$current_edge" == "$SOURCE_SHA" ]]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the edge release names ${current_edge:-nothing}; the edge image tag stays"
            echo "move=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the rolling edge image
        if: steps.rolling.outputs.move == 'true'
        env:
          IMAGE: ${{ steps.ghcr.outputs.image }}
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:${BUILD_TAG}" "${IMAGE}:edge"
          docker push "${IMAGE}:edge"

      # Skipped when the DOCKERHUB_* secrets are not configured. With an org
      # access token, DOCKERHUB_USERNAME is the org name and the image
      # namespace.
      - name: Push to Docker Hub
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: ${{ steps.ghcr.outputs.image }}
          MOVE: ${{ steps.rolling.outputs.move }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "DOCKERHUB_* secrets not configured; skipping Docker Hub publish."
            exit 0
          fi
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin
          image_exists() {
            local out
            if out="$(docker buildx imagetools inspect "$1" 2>&1)"; then
              return 0
            fi
            if grep -q ': not found' <<<"$out"; then
              return 1
            fi
            echo "::error::cannot tell whether $1 exists: ${out}"
            exit 1
          }
          hub="docker.io/${DOCKERHUB_USERNAME}/omnigraph-server"
          if ! image_exists "${hub}:${BUILD_TAG}"; then
            docker tag "${IMAGE}:${BUILD_TAG}" "${hub}:${BUILD_TAG}"
            docker push "${hub}:${BUILD_TAG}"
          fi
          if [[ "$MOVE" == true ]]; then
            docker tag "${IMAGE}:${BUILD_TAG}" "${hub}:edge"
            docker push "${hub}:edge"
          fi
          digest="$(docker buildx imagetools inspect "${hub}:${BUILD_TAG}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${hub}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Stored with GitHub's attestations, which `gh attestation verify
      # oci://docker.io/...` reads by digest.
      - name: Attest Docker Hub image provenance
        if: steps.dockerhub.outputs.digest != ''
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.dockerhub.outputs.image }}
          subject-digest: ${{ steps.dockerhub.outputs.digest }}
          push-to-registry: false

      - name: Report pinned digests
        env:
          GHCR_IMAGE: ${{ steps.ghcr.outputs.image }}
          GHCR_DIGEST: ${{ steps.ghcr.outputs.digest }}
          HUB_IMAGE: ${{ steps.dockerhub.outputs.image }}
          HUB_DIGEST: ${{ steps.dockerhub.outputs.digest }}
        run: |
          {
            echo "## Edge image published"
            echo
            echo '```'
            echo "${GHCR_IMAGE}:${BUILD_TAG}"
            echo "${GHCR_IMAGE}@${GHCR_DIGEST}"
            if [[ -n "$HUB_DIGEST" ]]; then
              echo "${HUB_IMAGE}:${BUILD_TAG}"
              echo "${HUB_IMAGE}@${HUB_DIGEST}"
            fi
            echo '```'
            echo
            echo "Pin deployments to the digest form."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke_installers:
    name: Smoke ${{ matrix.runner }} installer
    needs: [vocabulary_gate, prepare_edge_release, publish_edge_release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    env:
      BUILD_TAG: ${{ needs.prepare_edge_release.outputs.build_tag }}
      SOURCE_SHA: ${{ needs.vocabulary_gate.outputs.source_sha }}
      MOVED: ${{ needs.publish_edge_release.outputs.moved }}
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.vocabulary_gate.outputs.source_sha }}
          persist-credentials: false

      - name: Install the pinned build and the edge channel
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          check() {
            "$1/omnigraph" version
            "$1/omnigraph" version --json > "$1/version.json"
            python3 - "$1/version.json" <<'PY'
          import json, os, sys
          facts = json.load(open(sys.argv[1]))
          expected = ("edge", os.environ["SOURCE_SHA"])
          if (facts["channel"], facts["commit"]) != expected:
              raise SystemExit(f"installed {facts['channel']}/{facts['commit']}, expected {expected}")
          PY
            "$1/omnigraph-server" --help > /dev/null
            "$1/omnigraph-azure-admission" --help > /dev/null
          }
          VERSION="$BUILD_TAG" INSTALL_DIR="$RUNNER_TEMP/pinned" bash scripts/install.sh
          check "$RUNNER_TEMP/pinned"
          # The channel serves this build only while the rolling release still
          # names it; a later rerun of this job may find a newer build there.
          current_edge="$(git ls-remote origin refs/tags/edge | awk '{print $1}')"
          if [[ "$MOVED" == true && "$current_edge" == "$SOURCE_SHA" ]]; then
            RELEASE_CHANNEL=edge INSTALL_DIR="$RUNNER_TEMP/channel" bash scripts/install.sh
            check "$RUNNER_TEMP/channel"
          fi

      - name: Install the pinned build and the edge channel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Test-Installed([string]$Dir) {
            & "$Dir/omnigraph.exe" version
            $facts = & "$Dir/omnigraph.exe" version --json | Out-String | ConvertFrom-Json
            if ($facts.channel -ne "edge" -or $facts.commit -ne $env:SOURCE_SHA) {
              throw "installed $($facts.channel)/$($facts.commit), expected edge/$env:SOURCE_SHA"
            }
            & "$Dir/omnigraph-server.exe" --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "omnigraph-server --help failed" }
            & "$Dir/omnigraph-azure-admission.exe" --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "omnigraph-azure-admission --help failed" }
          }
          ./scripts/install.ps1 -Version $env:BUILD_TAG -InstallDir "$env:RUNNER_TEMP/pinned"
          Test-Installed "$env:RUNNER_TEMP/pinned"
          # The channel serves this build only while the rolling release still
          # names it; a later rerun of this job may find a newer build there.
          $currentEdge = ((git ls-remote origin refs/tags/edge) -split '\s+')[0]
          if ($env:MOVED -eq "true" -and $currentEdge -eq $env:SOURCE_SHA) {
            ./scripts/install.ps1 -ReleaseChannel edge -InstallDir "$env:RUNNER_TEMP/channel"
            Test-Installed "$env:RUNNER_TEMP/channel"
          }
