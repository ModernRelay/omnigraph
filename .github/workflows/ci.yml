name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A protected-main run may publish a write-once dependency binding only
  # after every other owner succeeds. Never cancel it around that final
  # mutation; PR supersession remains safe and desirable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_full_ci: ${{ steps.filter.outputs.run_full_ci }}
      run_rustfs_ci: ${{ steps.filter.outputs.run_rustfs_ci }}
      firehose_scope: ${{ steps.firehose.outputs.firehose_scope }}
      firehose_base_source_key: ${{ steps.firehose.outputs.firehose_base_source_key }}
      firehose_head_source_key: ${{ steps.firehose.outputs.firehose_head_source_key }}
      firehose_dependency_inputs_changed: ${{ steps.firehose.outputs.firehose_dependency_inputs_changed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Detect text-only changes
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            echo "run_full_ci=true" >> "$GITHUB_OUTPUT"
            echo "run_rustfs_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-parse "${head}^" 2>/dev/null || true)"
            fi
          fi

          if [[ -z "${base:-}" ]]; then
            echo "run_full_ci=true" >> "$GITHUB_OUTPUT"
            echo "run_rustfs_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$base" "$head")
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "run_full_ci=true" >> "$GITHUB_OUTPUT"
            echo "run_rustfs_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_full_ci=false
          run_rustfs_ci=false
          for path in "${changed[@]}"; do
            case "$path" in
              *.md|*.mdx|*.txt|*.rst|*.adoc) ;;
              *)
                run_full_ci=true
                ;;
            esac

            if [[ "$EVENT_NAME" != "pull_request" ]]; then
              if [[ "$run_full_ci" == "true" ]]; then
                run_rustfs_ci=true
              fi
              continue
            fi

            case "$path" in
              .github/workflows/ci.yml|Cargo.toml|Cargo.lock|crates/*/Cargo.toml) run_rustfs_ci=true ;;
              crates/omnigraph/src/storage.rs) run_rustfs_ci=true ;;
              crates/omnigraph/src/db/manifest.rs|crates/omnigraph/src/db/manifest/*) run_rustfs_ci=true ;;
              crates/omnigraph/src/db/omnigraph.rs|crates/omnigraph/src/db/omnigraph/stream_enrollment.rs|crates/omnigraph/src/db/omnigraph/stream_ingest.rs) run_rustfs_ci=true ;;
              crates/omnigraph/tests/s3_storage.rs|crates/omnigraph/tests/write_cost_s3.rs|crates/omnigraph/tests/lance_surface_guards.rs|crates/omnigraph/tests/memwal_enrollment_gate.rs|crates/omnigraph/tests/memwal_stream.rs|crates/omnigraph/tests/memwal_stream_cost.rs|crates/omnigraph/tests/failpoints.rs|crates/omnigraph/tests/helpers/*) run_rustfs_ci=true ;;
              crates/omnigraph/src/table_store.rs|crates/omnigraph/src/table_store/mem_wal.rs|crates/omnigraph/src/table_store/mem_wal/*|crates/omnigraph/src/instrumentation.rs) run_rustfs_ci=true ;;
              crates/omnigraph/src/runtime_cache.rs|crates/omnigraph/src/graph_index/*) run_rustfs_ci=true ;;
              crates/omnigraph-storage/*|crates/omnigraph-control-authority/*) run_rustfs_ci=true ;;
              crates/omnigraph-cluster/src/store.rs|crates/omnigraph-cluster/src/serve.rs) run_rustfs_ci=true ;;
              crates/omnigraph-cluster/tests/s3_cluster.rs) run_rustfs_ci=true ;;
              crates/omnigraph-server/tests/s3.rs|crates/omnigraph-server/tests/support/*) run_rustfs_ci=true ;;
              crates/omnigraph-cli/tests/system_local.rs) run_rustfs_ci=true ;;
            esac
          done

          printf 'Changed files:\n'
          printf '  %s\n' "${changed[@]}"
          echo "run_full_ci=$run_full_ci" >> "$GITHUB_OUTPUT"
          echo "run_rustfs_ci=$run_rustfs_ci" >> "$GITHUB_OUTPUT"

      - name: Classify firehose scope and dependency inputs
        id: firehose
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            key="$(FIREHOSE_SOURCE_ONLY=1 scripts/ci/firehose-key.sh)"
            {
              echo "firehose_scope=source"
              echo "firehose_base_source_key=$key"
              echo "firehose_head_source_key=$key"
              echo "firehose_dependency_inputs_changed=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-parse "${head}^" 2>/dev/null || true)"
            fi
          fi

          if [[ -z "${base:-}" ]]; then
            key="$(FIREHOSE_SOURCE_ONLY=1 scripts/ci/firehose-key.sh)"
            {
              echo "firehose_scope=source"
              echo "firehose_base_source_key=$key"
              echo "firehose_head_source_key=$key"
              echo "firehose_dependency_inputs_changed=true"
            } >> "$GITHUB_OUTPUT"
          else
            scripts/ci/firehose-classify.sh "$base" "$head" >> "$GITHUB_OUTPUT"
          fi

  check_agents_md:
    name: Check AGENTS.md Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify AGENTS.md ↔ docs/ cross-links
        run: bash scripts/check-agents-md.sh

  entrypoint_test:
    name: Container Entrypoint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify omnigraph-server entrypoint arg composition
        run: sh docker/entrypoint_test.sh

  test:
    name: Test Workspace
    needs: classify_changes
    # PR latency: the workspace gate runs only for non-text pushes to `main`
    # (post-merge), tags, and manual `workflow_dispatch` — NOT on pull_request.
    # Trade-off accepted deliberately: a regression is caught on the `main`
    # run after merge rather than before it, so `main` can briefly go red.
    # Mitigations:
    # (1) `Test Workspace` is removed from required PR checks in
    #     `.github/branch-protection.json` (a required check that never
    #     reports would leave every PR permanently pending);
    # (2) run the full suite locally before merging risky changes
    #     (`cargo test --workspace --locked --features
    #     omnigraph-engine/failpoints,omnigraph-cluster/failpoints`), or trigger
    #     this workflow via the Actions "Run workflow" button on your branch;
    # (3) openapi.json is not auto-regenerated — regenerate it locally for
    #     server/API changes
    #     (`OMNIGRAPH_UPDATE_OPENAPI=1 cargo test -p omnigraph-server --test openapi`)
    #     or the strict drift check fails the post-merge `main` run.
    if: github.event_name != 'pull_request' && needs.classify_changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    # The 2026-07-28 cold diagnostic spent 25m29s on the featureless workspace
    # graph, then another 23m21s compiling the failpoints graph. Build the
    # current tree once with the feature superset instead. The genuine v9
    # binary/fence and RustFS shards are independent parallel jobs below, so
    # this job has one current-tree compile and a bounded 60-minute ceiling.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      firehose_key: ${{ steps.firehose_key.outputs.key }}
      firehose_target_artifact_id: ${{ steps.firehose_target.outputs.artifact-id }}
    env:
      CARGO_TERM_COLOR: always
      # Floor for the whole class of debug-build async stack depth, NOT the fix
      # for any one test. Unoptimized builds keep every nested async frame, so
      # a deep engine path (init -> write -> publish -> recovery -> Lance) can
      # approach a default 2 MiB spawned-thread stack. The depth is genuinely
      # environment-sensitive: the same tree overflowed `write_cost` on this
      # Linux runner while macOS stayed under, and overflowed a different cell
      # (`memwal_stream_cost`) on macOS. Individual offenders are still fixed at
      # the source with `Box::pin` (see `helpers::cost::cost_harness`); this
      # keeps CI deterministic across runners while that work continues.
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev zstd

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target

      - name: Derive exact firehose dependency key
        id: firehose_key
        run: |
          set -euo pipefail
          packages="$(dpkg-query -W -f='${Package}=${Version}\n' \
            protobuf-compiler libprotobuf-dev zstd | LC_ALL=C sort)"
          runner_image="${ImageOS:-ubuntu}-${ImageVersion:-unknown}"
          {
            echo "FIREHOSE_SYSTEM_PACKAGES<<EOF"
            echo "$packages"
            echo "EOF"
            echo "FIREHOSE_RUNNER_IMAGE=$runner_image"
          } >> "$GITHUB_ENV"
          key="$(
            FIREHOSE_SYSTEM_PACKAGES="$packages" \
            FIREHOSE_RUNNER_IMAGE="$runner_image" \
              scripts/ci/firehose-key.sh
          )"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Run workspace and failpoint tests once
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/workspace-tests.log"
          cargo test --workspace --locked \
            --features omnigraph-engine/failpoints,omnigraph-cluster/failpoints \
            -- --nocapture 2>&1 | tee "$test_log"

          grep -Fq "Gate R0 widest local:" "$test_log" \
            || { echo "::error::Gate R0 local closure cell did not produce evidence"; exit 1; }
          for test_name in \
            gate_r0_current_inventory_path_classifier_is_canonical_and_fail_closed \
            gate_r0_source_audit_revision_tripwire_matches_surveyed_lance \
            gate_r0_retain_all_current_object_growth_is_swept_explicitly \
            gate_r0_referenced_cut_retry_reuses_the_same_generation_root_local \
            gate_r0_widest_generation_closes_and_records_retain_all_growth_local
          do
            grep -Eq "test ${test_name} \.\.\. ok" "$test_log" \
              || { echo "::error::required positive Gate R0 cell '${test_name}' did not execute normally"; exit 1; }
          done
          for test_name in \
            gate_r0_current_inventory_refuses_manifest_for_another_shard \
            gate_r0_current_inventory_refuses_duplicate_generation_authority \
            gate_r0_current_inventory_refuses_zero_current_generation \
            gate_r0_current_inventory_refuses_non_advanced_current_generation \
            gate_r0_current_inventory_refuses_manifest_filename_body_version_mismatch \
            gate_r0_current_inventory_refuses_gapped_manifest_version_chain \
            gate_r0_current_inventory_refuses_listed_shard_without_manifest
          do
            grep -Eq "test ${test_name} - should panic \.\.\. ok" "$test_log" \
              || { echo "::error::required negative Gate R0 cell '${test_name}' did not execute as should-panic"; exit 1; }
          done

          grep -Eq "test b2a_retained_history_small_depth_keeps_terms_and_old_roots_separate \.\.\. ok" "$test_log" \
            || { echo "::error::required B2a retained-history regression cell did not execute normally"; exit 1; }
          for test_name in \
            b2a_retained_history_decision_scale_sweeps_to_128_generations \
            b2a_retained_history_decision_scale_sweeps_to_128_generations_on_configured_rustfs
          do
            grep -Eq "test ${test_name} \.\.\. ignored" "$test_log" \
              || { echo "::error::B2a decision-scale cell '${test_name}' did not remain explicitly ignored"; exit 1; }
          done
          grep -Fq "B2a retained-history ci depth=" "$test_log" \
            || { echo "::error::B2a retained-history regression cell produced no evidence"; exit 1; }

          # This is a one-sided peak-lift remeasurement tripwire for the current
          # single-exclusive-fold shape, not a runtime allocator limit.
          grep -Eq "test widest_legal_generation_records_no_roll_estimates_and_peak_rss \.\.\. ok" "$test_log" \
            || { echo "::error::Gate R0 RSS remeasurement cell did not execute normally"; exit 1; }
          grep -Fq "fold_delta_remeasure_bytes=402653184" "$test_log" \
            || { echo "::error::Gate R0 RSS evidence line or 384-MiB tripwire changed"; exit 1; }

      # The protected-main publisher below reuses this exact target. It does
      # not run Cargo a second time. `pack` removes workspace crate outputs
      # before archiving, so the reusable key excludes ordinary source.
      - name: Pack protected-main firehose dependency target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          scripts/ci/firehose-artifact.sh pack \
            "$RUNNER_TEMP/firehose-deps.tar.zst" \
            "${{ steps.firehose_key.outputs.key }}"

      - name: Upload current-run firehose target for the publisher
        id: firehose_target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firehose-main-target-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/firehose-deps.tar.zst
            ${{ runner.temp }}/firehose-deps.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  firehose_pr_smoke:
    name: Firehose PR smoke
    needs: classify_changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      mode: ${{ steps.outcome.outputs.mode }}
      key: ${{ steps.outcome.outputs.key }}
      warm_evidence_artifact_id: ${{ steps.warm_evidence.outputs.artifact-id }}
    env:
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: 16777216
    steps:
      - name: Require an authoritative classification
        env:
          CLASSIFY_RESULT: ${{ needs.classify_changes.result }}
          FIREHOSE_SCOPE: ${{ needs.classify_changes.outputs.firehose_scope }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "::error::Classify Changes did not succeed"
            exit 1
          fi
          if [[ "$FIREHOSE_SCOPE" != "docs-only" && "$FIREHOSE_SCOPE" != "source" ]]; then
            echo "::error::missing or invalid firehose classification"
            exit 1
          fi

      - name: Explicit docs-only no-op
        if: needs.classify_changes.outputs.firehose_scope == 'docs-only'
        run: echo "Proven docs-only change; firehose smoke is an explicit no-op."

      - name: Explain changed-key delegation
        if: >-
          github.event_name == 'pull_request' &&
          needs.classify_changes.outputs.firehose_scope == 'source' &&
          needs.classify_changes.outputs.firehose_dependency_inputs_changed == 'true'
        run: |
          echo "The dependency key changed; Firehose dependency rebuild owns"
          echo "the sole cold compile and smoke run under its 60-minute cap."

      - name: Checkout source
        if: >-
          github.event_name == 'pull_request' &&
          needs.classify_changes.outputs.firehose_scope == 'source' &&
          needs.classify_changes.outputs.firehose_dependency_inputs_changed == 'false'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install system dependencies
        if: >-
          github.event_name == 'pull_request' &&
          needs.classify_changes.outputs.firehose_scope == 'source' &&
          needs.classify_changes.outputs.firehose_dependency_inputs_changed == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev zstd

      - name: Install Rust stable
        if: >-
          github.event_name == 'pull_request' &&
          needs.classify_changes.outputs.firehose_scope == 'source' &&
          needs.classify_changes.outputs.firehose_dependency_inputs_changed == 'false'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Derive exact PR dependency key
        id: pr_key
        if: >-
          github.event_name == 'pull_request' &&
          needs.classify_changes.outputs.firehose_scope == 'source' &&
          needs.classify_changes.outputs.firehose_dependency_inputs_changed == 'false'
        run: |
          set -euo pipefail
          packages="$(dpkg-query -W -f='${Package}=${Version}\n' \
            protobuf-compiler libprotobuf-dev zstd | LC_ALL=C sort)"
          runner_image="${ImageOS:-ubuntu}-${ImageVersion:-unknown}"
          {
            echo "FIREHOSE_SYSTEM_PACKAGES<<EOF"
            echo "$packages"
            echo "EOF"
            echo "FIREHOSE_RUNNER_IMAGE=$runner_image"
          } >> "$GITHUB_ENV"
          key="$(
            FIREHOSE_SYSTEM_PACKAGES="$packages" \
            FIREHOSE_RUNNER_IMAGE="$runner_image" \
              scripts/ci/firehose-key.sh
          )"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Locate protected-main dependency artifact
        id: lookup
        if: steps.pr_key.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/firehose-artifact.sh lookup \
            "${{ steps.pr_key.outputs.key }}" >> "$GITHUB_OUTPUT"

      - name: Download protected-main dependency artifact
        if: steps.lookup.outputs.found == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.lookup.outputs.artifact_id }}
          path: ${{ runner.temp }}/firehose-trusted
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.lookup.outputs.run_id }}

      - name: Verify and restore protected-main dependency artifact
        if: steps.lookup.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/firehose-artifact.sh verify \
            "$RUNNER_TEMP/firehose-trusted/firehose-deps.tar.zst" \
            "${{ steps.pr_key.outputs.key }}" \
            "${{ steps.lookup.outputs.head_sha }}"
          scripts/ci/firehose-artifact.sh restore \
            "$RUNNER_TEMP/firehose-trusted/firehose-deps.tar.zst"

      - name: Run bounded firehose smoke
        id: warm_smoke
        if: steps.lookup.outputs.found == 'true'
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          start_seconds="$SECONDS"
          scripts/ci/firehose-smoke.sh
          elapsed="$((SECONDS - start_seconds))"
          jq -n \
            --arg format "omnigraph-firehose-warm-evidence-v1" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg head_sha "$GITHUB_SHA" \
            --arg key "${{ steps.pr_key.outputs.key }}" \
            --arg publisher_run_id "${{ steps.lookup.outputs.run_id }}" \
            --arg publisher_sha "${{ steps.lookup.outputs.head_sha }}" \
            --arg artifact_id "${{ steps.lookup.outputs.artifact_id }}" \
            --arg started_at "$started_at" \
            --argjson elapsed_seconds "$elapsed" \
            '{
              format: $format,
              run_id: $run_id,
              head_sha: $head_sha,
              key: $key,
              publisher_run_id: $publisher_run_id,
              publisher_sha: $publisher_sha,
              artifact_id: $artifact_id,
              started_at: $started_at,
              elapsed_seconds: $elapsed_seconds,
              attestation: "verified",
              smoke: "passed"
            }' > "$RUNNER_TEMP/firehose-warm-evidence.json"

      - name: Upload current-run warm evidence
        id: warm_evidence
        if: steps.warm_smoke.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firehose-warm-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/firehose-warm-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Record smoke disposition
        id: outcome
        env:
          FIREHOSE_SCOPE: ${{ needs.classify_changes.outputs.firehose_scope }}
          INPUTS_CHANGED: ${{ needs.classify_changes.outputs.firehose_dependency_inputs_changed }}
          PR_KEY: ${{ steps.pr_key.outputs.key }}
          TRUSTED_FOUND: ${{ steps.lookup.outputs.found }}
          WARM_EVIDENCE_ID: ${{ steps.warm_evidence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [[ "$FIREHOSE_SCOPE" == "docs-only" ]]; then
            mode="docs-only"
            key=""
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            mode="main-workspace"
            key=""
          elif [[ "$INPUTS_CHANGED" == "true" ]]; then
            mode="delegated-changed"
            key=""
          elif [[ "$TRUSTED_FOUND" != "true" ]]; then
            mode="delegated-missing"
            key="$PR_KEY"
          else
            mode="verified"
            key="$PR_KEY"
            test -s "$RUNNER_TEMP/firehose-warm-evidence.json"
            test -n "$WARM_EVIDENCE_ID"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Firehose smoke disposition: $mode"

  firehose_dependency_rebuild:
    name: Firehose dependency rebuild
    needs:
      - classify_changes
      - firehose_pr_smoke
      - test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.outcome.outputs.mode }}
      key: ${{ steps.outcome.outputs.key }}
    env:
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: 16777216
    steps:
      - name: Require authoritative upstream results
        env:
          CLASSIFY_RESULT: ${{ needs.classify_changes.result }}
          FIREHOSE_SCOPE: ${{ needs.classify_changes.outputs.firehose_scope }}
          SMOKE_RESULT: ${{ needs.firehose_pr_smoke.result }}
          SMOKE_MODE: ${{ needs.firehose_pr_smoke.outputs.mode }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == "success" ]]
          [[ "$SMOKE_RESULT" == "success" ]]
          case "$SMOKE_MODE" in
            docs-only|main-workspace|verified|delegated-changed|delegated-missing) ;;
            *)
              echo "::error::Firehose PR smoke emitted no valid disposition"
              exit 1
              ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            [[ "$TEST_RESULT" == "skipped" ]]
          elif [[ "$FIREHOSE_SCOPE" == "source" ]]; then
            [[ "$TEST_RESULT" == "success" ]]
          fi

      - name: Explicit docs-only no-op
        if: needs.firehose_pr_smoke.outputs.mode == 'docs-only'
        run: echo "Proven docs-only change; dependency rebuild is an explicit no-op."

      - name: Download current-run verified evidence
        if: needs.firehose_pr_smoke.outputs.mode == 'verified'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.firehose_pr_smoke.outputs.warm_evidence_artifact_id }}
          path: ${{ runner.temp }}/firehose-warm-evidence
          merge-multiple: true

      - name: Verify unchanged-key disposition
        if: needs.firehose_pr_smoke.outputs.mode == 'verified'
        run: |
          jq -e \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg head_sha "$GITHUB_SHA" \
            --arg key "${{ needs.firehose_pr_smoke.outputs.key }}" \
            '.format == "omnigraph-firehose-warm-evidence-v1"
             and .run_id == $run_id
             and .head_sha == $head_sha
             and .key == $key
             and .attestation == "verified"
             and .smoke == "passed"
             and (.elapsed_seconds >= 0 and .elapsed_seconds <= 780)' \
            "$RUNNER_TEMP/firehose-warm-evidence/firehose-warm-evidence.json" \
            >/dev/null

      - name: Checkout source for cold exception
        if: >-
          needs.firehose_pr_smoke.outputs.mode == 'delegated-changed' ||
          needs.firehose_pr_smoke.outputs.mode == 'delegated-missing'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Install system dependencies for cold exception
        if: >-
          needs.firehose_pr_smoke.outputs.mode == 'delegated-changed' ||
          needs.firehose_pr_smoke.outputs.mode == 'delegated-missing'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev zstd

      - name: Install Rust stable for cold exception
        if: >-
          needs.firehose_pr_smoke.outputs.mode == 'delegated-changed' ||
          needs.firehose_pr_smoke.outputs.mode == 'delegated-missing'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Derive cold dependency key
        id: cold_key
        if: >-
          needs.firehose_pr_smoke.outputs.mode == 'delegated-changed' ||
          needs.firehose_pr_smoke.outputs.mode == 'delegated-missing'
        run: |
          set -euo pipefail
          packages="$(dpkg-query -W -f='${Package}=${Version}\n' \
            protobuf-compiler libprotobuf-dev zstd | LC_ALL=C sort)"
          runner_image="${ImageOS:-ubuntu}-${ImageVersion:-unknown}"
          key="$(
            FIREHOSE_SYSTEM_PACKAGES="$packages" \
            FIREHOSE_RUNNER_IMAGE="$runner_image" \
              scripts/ci/firehose-key.sh
          )"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cold-build and run the sole smoke owner
        id: cold_rebuild
        if: steps.cold_key.outcome == 'success'
        env:
          # Leave five minutes of the aggregate job ceiling for checkout,
          # packages, classification, and evidence recording.
          FIREHOSE_SMOKE_TIMEOUT_SECONDS: 3300
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          start_seconds="$SECONDS"
          scripts/ci/firehose-smoke.sh
          elapsed="$((SECONDS - start_seconds))"
          jq -n \
            --arg format "omnigraph-firehose-rebuild-evidence-v1" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg head_sha "$GITHUB_SHA" \
            --arg key "${{ steps.cold_key.outputs.key }}" \
            --arg started_at "$started_at" \
            --argjson elapsed_seconds "$elapsed" \
            '{
              format: $format,
              run_id: $run_id,
              head_sha: $head_sha,
              key: $key,
              started_at: $started_at,
              elapsed_seconds: $elapsed_seconds,
              smoke: "passed"
            }' > "$RUNNER_TEMP/firehose-rebuild-evidence.json"

      - name: Record dependency disposition
        id: outcome
        env:
          SMOKE_MODE: ${{ needs.firehose_pr_smoke.outputs.mode }}
          SMOKE_KEY: ${{ needs.firehose_pr_smoke.outputs.key }}
          COLD_KEY: ${{ steps.cold_key.outputs.key }}
          MAIN_KEY: ${{ needs.test.outputs.firehose_key }}
        run: |
          set -euo pipefail
          case "$SMOKE_MODE" in
            docs-only)
              mode="docs-only"
              key=""
              ;;
            main-workspace)
              mode="main-workspace"
              key="$MAIN_KEY"
              [[ -n "$key" ]]
              ;;
            verified)
              mode="verified"
              key="$SMOKE_KEY"
              [[ -n "$key" ]]
              ;;
            delegated-changed|delegated-missing)
              mode="rebuilt"
              key="$COLD_KEY"
              [[ -n "$key" ]]
              test -s "$RUNNER_TEMP/firehose-rebuild-evidence.json"
              ;;
            *)
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Firehose dependency disposition: $mode"

  firehose_publish_dependencies:
    name: Publish protected-main firehose dependencies
    needs:
      - classify_changes
      - check_agents_md
      - entrypoint_test
      - test
      - firehose_pr_smoke
      - firehose_dependency_rebuild
      - v9_v10_format_fence
      - test_aws_feature
      - rustfs_integration
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.classify_changes.outputs.firehose_scope == 'source' &&
      needs.check_agents_md.result == 'success' &&
      needs.entrypoint_test.result == 'success' &&
      needs.test.result == 'success' &&
      needs.firehose_pr_smoke.result == 'success' &&
      needs.firehose_dependency_rebuild.result == 'success' &&
      needs.v9_v10_format_fence.result == 'success' &&
      needs.test_aws_feature.result == 'success' &&
      needs.rustfs_integration.result == 'success'
    concurrency:
      group: firehose-dependencies-${{ needs.test.outputs.firehose_key }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout publisher workflow and verifier
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download the exact target built by Test Workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.firehose_target_artifact_id }}
          path: ${{ runner.temp }}/firehose-main-target
          merge-multiple: true

      - name: Locate an existing write-once binding
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/firehose-artifact.sh lookup \
            "${{ needs.test.outputs.firehose_key }}" >> "$GITHUB_OUTPUT"

      - name: Download an existing protected-main artifact
        if: steps.lookup.outputs.found == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.lookup.outputs.artifact_id }}
          path: ${{ runner.temp }}/firehose-existing
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.lookup.outputs.run_id }}

      - name: Verify the existing write-once binding
        if: steps.lookup.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/firehose-artifact.sh verify \
            "$RUNNER_TEMP/firehose-existing/firehose-deps.tar.zst" \
            "${{ needs.test.outputs.firehose_key }}" \
            "${{ steps.lookup.outputs.head_sha }}"

      # Attest before upload. If attestation fails, no durable keyed artifact
      # is exposed. Upload is the final mutating step in this job.
      - name: Attest the new dependency archive
        if: steps.lookup.outputs.found != 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/firehose-main-target/firehose-deps.tar.zst

      - name: Publish the immutable keyed dependency artifact
        if: steps.lookup.outputs.found != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firehose-deps-${{ needs.test.outputs.firehose_key }}
          path: |
            ${{ runner.temp }}/firehose-main-target/firehose-deps.tar.zst
            ${{ runner.temp }}/firehose-main-target/firehose-deps.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  v9_v10_format_fence:
    name: V9 ↔ V10 Format Fence
    needs: classify_changes
    if: github.event_name != 'pull_request' && needs.classify_changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    # This job owns the immutable predecessor build in parallel with the
    # current-tree workspace job. The 2026-07-28 cold measurement was 25m40s
    # for v9; exact current-CLI fence compilation reuses the same locked
    # dependency graph and retains bounded headroom here.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cross-version build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
          key: crossversion-v9-v10

      # CI pins only the immediate predecessor. Older seams remain env-gated
      # and on-demand, per docs/dev/testing.md.
      - name: Build genuine final-v9 CLI
        env:
          # Last v9-writing main commit before RFC-026 §4.7 P1 activates v10.
          # Keep this immutable: HEAD^ stops being v9 after the first v10 merge.
          FINAL_INTERNAL_V9_COMMIT: e889a1c72004eb09f2be35b59ab6586d10c709e1
        run: |
          set -euo pipefail
          v9_source="$RUNNER_TEMP/omnigraph-final-v9"
          v9_bin="$RUNNER_TEMP/omnigraph-final-v9-bin"
          git fetch --no-tags --depth=1 origin "$FINAL_INTERNAL_V9_COMMIT"
          git worktree add --detach "$v9_source" "$FINAL_INTERNAL_V9_COMMIT"
          cargo build --locked \
            --manifest-path "$v9_source/Cargo.toml" \
            --package omnigraph-cli \
            --bin omnigraph \
            --target-dir "$GITHUB_WORKSPACE/target"
          cp "$GITHUB_WORKSPACE/target/debug/omnigraph" "$v9_bin"
          test -x "$v9_bin"
          cargo clean --target-dir "$GITHUB_WORKSPACE/target" \
            --package omnigraph-compiler \
            --package omnigraph-policy \
            --package omnigraph-engine \
            --package omnigraph-api-types \
            --package omnigraph-cluster \
            --package omnigraph-server \
            --package omnigraph-cli
          echo "OMNIGRAPH_V9_BIN=$v9_bin" >> "$GITHUB_ENV"

      - name: Run exact v9↔v10 refusal and rebuild fence
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/v9-v10-format-fence.log"
          cargo test --locked -p omnigraph-cli --test crossversion_upgrade \
            current_v10_refuses_and_rebuilds_genuine_v9_and_v9_refuses_v10 \
            -- --exact --nocapture 2>&1 | tee "$test_log"
          if grep -Fq "skipping immediate-predecessor v9 upgrade test" "$test_log"; then
            echo "::error::v9↔v10 format fence skipped despite a configured predecessor binary"
            exit 1
          fi
          grep -Eq "test current_v10_refuses_and_rebuilds_genuine_v9_and_v9_refuses_v10 \.\.\. ok" "$test_log" \
            || { echo "::error::exact v9↔v10 format fence did not execute normally"; exit 1; }
          grep -Eq "test result: ok\. 1 passed; 0 failed" "$test_log" \
            || { echo "::error::v9↔v10 format fence matched the wrong test set"; exit 1; }

  test_aws_feature:
    name: Test omnigraph-server --features aws
    needs: classify_changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Skip for text-only changes
        if: needs.classify_changes.outputs.run_full_ci != 'true'
        run: echo "Text-only change detected; skipping aws feature build."

      - name: Checkout source
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install system dependencies
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install Rust stable
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build data
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
          key: aws-feature

      - name: Build omnigraph-server with aws feature
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        run: cargo build --locked -p omnigraph-server --features aws

      - name: Test omnigraph-server with aws feature
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        run: cargo test --locked -p omnigraph-server --features aws

  rustfs_integration:
    name: RustFS S3 Integration (${{ matrix.shard }})
    # This remains push-/tag-/dispatch-only, but no longer waits for the
    # independent workspace job. Starting both cold compile graphs together
    # removes that dependency from the workflow's critical path.
    #
    # Two parallel feature graphs: the default graph compiles every selected
    # engine/server/cluster/CLI test binary in one Cargo invocation, while the
    # failpoints graph stays isolated. Presenting the full default DAG together
    # avoids discovering it as a serial compile/link waterfall. The previous
    # five-shard layout repeated the same ~26-29m cold substrate compile five
    # times and maintained five target caches, pressuring GitHub's repository
    # cache cap. `fail-fast: false` lets both graphs report independently.
    needs: classify_changes
    if: github.event_name != 'pull_request' && needs.classify_changes.outputs.run_rustfs_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - default
          - failpoints
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
      AWS_ALLOW_HTTP: "true"
      AWS_S3_FORCE_PATH_STYLE: "true"
      OMNIGRAPH_S3_TEST_BUCKET: omnigraph-ci
      OMNIGRAPH_S3_TEST_PREFIX: github-actions
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev python3-pip

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # One cache per feature graph avoids both feature thrash and the
          # previous five copies of the shared substrate.
          key: ${{ matrix.shard }}
          workspaces: |
            . -> target

      - name: Start RustFS
        # Pinned to 1.0.0-beta.8 (2026-06-10). beta.4+ refuses "default"
        # credentials (rustfsadmin/rustfsadmin) unless
        # RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS=true is set — fine for
        # an ephemeral CI container. The three S3 suites were validated
        # against the beta.8 binary locally before this bump. Keep the pin
        # explicit (never `latest`) so upgrades are deliberate.
        run: |
          docker rm -f rustfs >/dev/null 2>&1 || true
          docker run -d \
            --name rustfs \
            -p 9000:9000 \
            -p 9001:9001 \
            -e RUSTFS_ACCESS_KEY="${AWS_ACCESS_KEY_ID}" \
            -e RUSTFS_SECRET_KEY="${AWS_SECRET_ACCESS_KEY}" \
            -e RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS=true \
            rustfs/rustfs:1.0.0-beta.8 \
            /data

      - name: Install AWS CLI
        run: |
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create RustFS test bucket
        run: |
          for _ in $(seq 1 30); do
            if aws --endpoint-url "${AWS_ENDPOINT_URL_S3}" s3api list-buckets >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          aws --endpoint-url "${AWS_ENDPOINT_URL_S3}" \
            s3api create-bucket \
            --bucket "${OMNIGRAPH_S3_TEST_BUCKET}" >/dev/null 2>&1 || true

      # Compile and execute the selected default targets in one Cargo resolve.
      # A superset prebuild followed by narrower commands would still rebuild
      # workspace crates under different feature fingerprints.
      - name: Run RustFS default integration graph
        if: matrix.shard == 'default'
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/rustfs-default.log"
          cargo test --locked \
            -p omnigraph-engine \
            -p omnigraph-server \
            -p omnigraph-cluster \
            -p omnigraph-cli \
            --test s3_storage \
            --test lance_surface_guards \
            --test memwal_enrollment_gate \
            --test s3 \
            --test s3_cluster \
            --test system_local \
            -- --nocapture 2>&1 | tee "$test_log"

          if grep -Eiq \
            "SKIP (public_physical_ref_token_rejects_s3_same_version_aba|s3_memwal_enrollment_gate_positive_and_listing_negatives)|skipping s3 " \
            "$test_log"
          then
            echo "::error::a configured RustFS test emitted its unconfigured skip"
            exit 1
          fi

          for test_name in \
            s3_compatible_graph_lifecycle_works \
            s3_branch_change_merge_flow_works \
            s3_public_load_uses_hidden_run_and_publishes \
            s3_adapter_conditional_writes_contract \
            s3_schema_apply_migrates_live_graph \
            s3_fresh_branch_traversal_reuses_main_graph_index_with_etags \
            public_physical_ref_token_rejects_s3_same_version_aba \
            s3_memwal_enrollment_gate_positive_and_listing_negatives \
            server_opens_s3_graph_directly_and_serves_snapshot_and_read \
            server_boots_cluster_from_bare_storage_uri_and_serves_query \
            s3_cluster_full_lifecycle_import_apply_serve_evolve_delete \
            local_cli_s3_end_to_end_init_load_read_flow
          do
            grep -Eq "test ${test_name} \.\.\. ok" "$test_log" \
              || { echo "::error::required RustFS cell '${test_name}' did not execute normally"; exit 1; }
          done

      # NOTE: the RFC-013 step-3a data-table opener COST gate (write_cost_s3) used
      # to run here. It is a deterministic IO-count gate, not a correctness test —
      # performance/cost contracts belong in a dedicated perf harness on a stable
      # runner + own cadence, not on the every-merge correctness path. Moved out of
      # CI pending that harness; run it on demand with a bucket set:
      #   OMNIGRAPH_S3_TEST_BUCKET=… cargo test -p omnigraph-engine --test write_cost_s3

      - name: Run RustFS recovery-sidecar lifecycle
        if: matrix.shard == 'failpoints'
        # Sidecar put/list/delete through the S3 storage backend on a
        # real bucket (the failpoint only wedges the publisher; the
        # sidecar I/O is exercised for real). Name filter `s3_` matches
        # the bucket-gated tests in the failpoints target only; the
        # grep guards against the filter going vacuous (cargo passes
        # with 0 tests matched) if those tests are ever renamed.
        run: |
          set +e
          output=$(cargo test --locked -p omnigraph-engine --features failpoints --test failpoints s3_ -- --nocapture 2>&1); status=$?
          set -e
          echo "$output"
          [ "$status" -eq 0 ] || exit "$status"
          echo "$output" | grep -Eq "test result: ok\. [1-9][0-9]* passed" \
            || { echo "::error::filter 's3_' matched no tests — vacuous pass"; exit 1; }

          set +e
          output=$(cargo test --locked -p omnigraph-engine --features failpoints --test memwal_stream s3_provider_shard_manifest_failure_retains_unreferenced_generation -- --exact --nocapture 2>&1); status=$?
          set -e
          echo "$output"
          [ "$status" -eq 0 ] || exit "$status"
          echo "$output" | grep -Fq "SKIP s3_provider_shard_manifest_failure_retains_unreferenced_generation" \
            && { echo "::error::RustFS B2a provider-failure cell skipped — vacuous pass"; exit 1; }
          echo "$output" | grep -Eq "test result: ok\. 1 passed" \
            || { echo "::error::RustFS B2a provider-failure filter matched no test — vacuous pass"; exit 1; }
          echo "$output" | grep -Eq "test s3_provider_shard_manifest_failure_retains_unreferenced_generation \.\.\. ok" \
            || { echo "::error::RustFS B2a provider-failure cell did not execute normally"; exit 1; }

          set +e
          output=$(cargo test --locked -p omnigraph-engine --features failpoints --test memwal_stream_cost gate_r0_widest_generation_closes_and_records_retain_all_growth_on_configured_rustfs -- --exact --nocapture 2>&1); status=$?
          set -e
          echo "$output"
          [ "$status" -eq 0 ] || exit "$status"
          echo "$output" | grep -Eq "test result: ok\. 1 passed" \
            || { echo "::error::RustFS Gate R0 filter matched no tests — vacuous pass"; exit 1; }
          echo "$output" | grep -Eq "test gate_r0_widest_generation_closes_and_records_retain_all_growth_on_configured_rustfs \.\.\. ok" \
            || { echo "::error::RustFS Gate R0 cell did not execute with positive-test polarity"; exit 1; }
          echo "$output" | grep -Fq "Gate R0 widest rustfs:" \
            || { echo "::error::RustFS Gate R0 test skipped instead of measuring configured storage"; exit 1; }

      - name: Dump RustFS logs on failure
        if: failure()
        run: docker logs rustfs
