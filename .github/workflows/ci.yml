name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep post-merge main runs alive so a red full-suite result is actionable.
  # Superseded PR runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_full_ci: ${{ steps.filter.outputs.run_full_ci }}
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            echo "run_full_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-parse "${head}^" 2>/dev/null || true)"
            fi
          fi

          if [[ -z "${base:-}" ]]; then
            echo "run_full_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Disable rename collapsing so moving source into docs still reports
          # the source-side deletion and cannot become a docs-only false skip.
          mapfile -t changed < <(git diff --name-only --no-renames "$base" "$head")
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "run_full_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_full_ci=false
          for path in "${changed[@]}"; do
            case "$path" in
              docs/*.md|docs/*.mdx|docs/*.rst|docs/*.adoc) ;;
              README.md|AGENTS.md|CLAUDE.md|CHANGELOG.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md) ;;
              LICENSE|LICENSE.md) ;;
              *)
                run_full_ci=true
                ;;
            esac
          done

          printf 'Changed files:\n'
          printf '  %s\n' "${changed[@]}"
          echo "run_full_ci=$run_full_ci" >> "$GITHUB_OUTPUT"

  check_agents_md:
    name: Check AGENTS.md Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify AGENTS.md ↔ docs/ cross-links
        run: bash scripts/check-agents-md.sh

  entrypoint_test:
    name: Container Entrypoint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify omnigraph-server entrypoint arg composition
        run: sh docker/entrypoint_test.sh

  test:
    name: Test Workspace
    needs: classify_changes
    # PR latency: the workspace gate runs only for pushes to `main` that are
    # not proven documentation-only
    # (post-merge), tags, and manual `workflow_dispatch` — NOT on pull_request.
    # Trade-off accepted deliberately: a regression is caught on the `main`
    # run after merge rather than before it, so `main` can briefly go red.
    # Mitigations:
    # (1) `Test Workspace` is removed from required PR checks in
    #     `.github/branch-protection.json` (a required check that never
    #     reports would leave every PR permanently pending);
    # (2) run the full suite locally before merging risky changes
    #     (`cargo test --workspace --locked --features
    #     omnigraph-engine/failpoints,omnigraph-cluster/failpoints`), or trigger
    #     this workflow via the Actions "Run workflow" button on your branch;
    # (3) openapi.json is not auto-regenerated — regenerate it locally for
    #     server/API changes
    #     (`OMNIGRAPH_UPDATE_OPENAPI=1 cargo test -p omnigraph-server --test openapi`)
    #     or the strict drift check fails the post-merge `main` run.
    if: github.event_name != 'pull_request' && needs.classify_changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    # The 2026-07-28 cold diagnostic spent 25m29s on the featureless workspace
    # graph, then another 23m21s compiling the failpoints graph. Build the
    # current tree once with the feature superset instead. The predecessor
    # binary/fence and RustFS shards are independent parallel jobs below, so
    # this job has one current-tree compile and a bounded 60-minute ceiling.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # Floor for the whole class of debug-build async stack depth, NOT the fix
      # for any one test. Unoptimized builds keep every nested async frame, so
      # a deep engine path (init -> write -> publish -> recovery -> Lance) can
      # approach a default 2 MiB spawned-thread stack. The depth is genuinely
      # environment-sensitive: the same tree overflowed `write_cost` on this
      # Linux runner while macOS stayed under, and overflowed a different cell
      # (`memwal_stream_cost`) on macOS. Individual offenders are still fixed at
      # the source with `Box::pin` (see `helpers::cost::cost_harness`); this
      # keeps CI deterministic across runners while that work continues.
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target

      - name: Run workspace and failpoint tests once
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/workspace-tests.log"
          cargo test --workspace --locked \
            --features omnigraph-engine/failpoints,omnigraph-cluster/failpoints \
            -- --nocapture 2>&1 | tee "$test_log"

          grep -Fq "Gate R0 widest local:" "$test_log" \
            || { echo "::error::Gate R0 local closure cell did not produce evidence"; exit 1; }
          for test_name in \
            gate_r0_current_inventory_path_classifier_is_canonical_and_fail_closed \
            gate_r0_source_audit_revision_tripwire_matches_surveyed_lance \
            gate_r0_retain_all_current_object_growth_is_swept_explicitly \
            gate_r0_referenced_cut_retry_reuses_the_same_generation_root_local \
            gate_r0_widest_generation_closes_and_records_retain_all_growth_local
          do
            grep -Eq "test ${test_name} \.\.\. ok" "$test_log" \
              || { echo "::error::required positive Gate R0 cell '${test_name}' did not execute normally"; exit 1; }
          done
          for test_name in \
            gate_r0_current_inventory_refuses_manifest_for_another_shard \
            gate_r0_current_inventory_refuses_duplicate_generation_authority \
            gate_r0_current_inventory_refuses_zero_current_generation \
            gate_r0_current_inventory_refuses_non_advanced_current_generation \
            gate_r0_current_inventory_refuses_manifest_filename_body_version_mismatch \
            gate_r0_current_inventory_refuses_gapped_manifest_version_chain \
            gate_r0_current_inventory_refuses_listed_shard_without_manifest
          do
            grep -Eq "test ${test_name} - should panic \.\.\. ok" "$test_log" \
              || { echo "::error::required negative Gate R0 cell '${test_name}' did not execute as should-panic"; exit 1; }
          done

          grep -Eq "test b2a_retained_history_small_depth_keeps_terms_and_old_roots_separate \.\.\. ok" "$test_log" \
            || { echo "::error::required B2a retained-history regression cell did not execute normally"; exit 1; }
          for test_name in \
            b2a_retained_history_decision_scale_sweeps_to_128_generations \
            b2a_retained_history_decision_scale_sweeps_to_128_generations_on_configured_rustfs
          do
            grep -Eq "test ${test_name} \.\.\. ignored" "$test_log" \
              || { echo "::error::B2a decision-scale cell '${test_name}' did not remain explicitly ignored"; exit 1; }
          done
          grep -Fq "B2a retained-history ci depth=" "$test_log" \
            || { echo "::error::B2a retained-history regression cell produced no evidence"; exit 1; }

          # This is a one-sided peak-lift remeasurement tripwire for the current
          # single-exclusive-fold shape, not a runtime allocator limit.
          grep -Eq "test widest_legal_generation_records_no_roll_estimates_and_peak_rss \.\.\. ok" "$test_log" \
            || { echo "::error::Gate R0 RSS remeasurement cell did not execute normally"; exit 1; }
          grep -Fq "fold_delta_remeasure_bytes=402653184" "$test_log" \
            || { echo "::error::Gate R0 RSS evidence line or 384-MiB tripwire changed"; exit 1; }

  v15_v16_format_fence:
    name: V15 ↔ V16 Format Fence
    needs: classify_changes
    if: github.event_name != 'pull_request' && needs.classify_changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    # This job owns the immutable predecessor build in parallel with the
    # current-tree workspace job. The 2026-07-28 cold measurement was 25m40s
    # for the predecessor CLI; exact current-CLI fence compilation reuses the same locked
    # dependency graph and retains bounded headroom here.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cross-version build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
          key: crossversion-v15-v16

      # CI pins only the immediate predecessor. Older seams remain env-gated
      # and on-demand, per docs/dev/testing.md.
      - name: Build genuine final-v15 CLI
        env:
          # Merge of the final v15-writing PR before recovery-v18 physical
          # rebind authority activates v16. Keep this immutable: HEAD^ stops
          # being v15 after the first v16 merge.
          FINAL_INTERNAL_V15_COMMIT: 84f3af758947970d16040a987cb1d6ea0f0931e8
        run: |
          set -euo pipefail
          v15_source="$RUNNER_TEMP/omnigraph-final-v15"
          v15_bin="$RUNNER_TEMP/omnigraph-final-v15-bin"
          git fetch --no-tags --depth=1 origin "$FINAL_INTERNAL_V15_COMMIT"
          git worktree add --detach "$v15_source" "$FINAL_INTERNAL_V15_COMMIT"
          cargo build --locked \
            --manifest-path "$v15_source/Cargo.toml" \
            --package omnigraph-cli \
            --bin omnigraph \
            --target-dir "$GITHUB_WORKSPACE/target"
          cp "$GITHUB_WORKSPACE/target/debug/omnigraph" "$v15_bin"
          test -x "$v15_bin"
          cargo clean --target-dir "$GITHUB_WORKSPACE/target" \
            --package omnigraph-compiler \
            --package omnigraph-policy \
            --package omnigraph-engine \
            --package omnigraph-api-types \
            --package omnigraph-cluster \
            --package omnigraph-server \
            --package omnigraph-cli
          echo "OMNIGRAPH_V15_BIN=$v15_bin" >> "$GITHUB_ENV"

      - name: Run exact v15↔v16 refusal and rebuild fence
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/v15-v16-format-fence.log"
          cargo test --locked -p omnigraph-cli --test crossversion_upgrade \
            current_v16_refuses_and_rebuilds_genuine_v15_and_v15_refuses_v16 \
            -- --exact --nocapture 2>&1 | tee "$test_log"
          if grep -Fq "skipping immediate-predecessor v15 upgrade test" "$test_log"; then
            echo "::error::v15↔v16 format fence skipped despite a configured predecessor binary"
            exit 1
          fi
          grep -Eq "test current_v16_refuses_and_rebuilds_genuine_v15_and_v15_refuses_v16 \.\.\. ok" "$test_log" \
            || { echo "::error::exact v15↔v16 format fence did not execute normally"; exit 1; }
          grep -Eq "test result: ok\. 1 passed; 0 failed" "$test_log" \
            || { echo "::error::v15↔v16 format fence matched the wrong test set"; exit 1; }

  test_aws_feature:
    name: Test omnigraph-server --features aws
    needs: classify_changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Skip for documentation-only changes
        if: needs.classify_changes.outputs.run_full_ci != 'true'
        run: echo "Documentation-only change detected; skipping aws feature build."

      - name: Checkout source
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install system dependencies
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install Rust stable
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build data
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
          key: aws-feature

      - name: Build omnigraph-server with aws feature
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        run: cargo build --locked -p omnigraph-server --features aws

      - name: Test omnigraph-server with aws feature
        if: needs.classify_changes.outputs.run_full_ci == 'true'
        run: cargo test --locked -p omnigraph-server --features aws

  rustfs_integration:
    name: RustFS S3 Integration (${{ matrix.shard }})
    # This remains push-/tag-/dispatch-only, but no longer waits for the
    # independent workspace job. Starting both cold compile graphs together
    # removes that dependency from the workflow's critical path.
    #
    # Two parallel feature graphs: the default graph compiles every selected
    # engine/server/cluster/CLI test binary in one Cargo invocation, while the
    # failpoints graph stays isolated. Presenting the full default DAG together
    # avoids discovering it as a serial compile/link waterfall. The previous
    # five-shard layout repeated the same ~26-29m cold substrate compile five
    # times and maintained five target caches, pressuring GitHub's repository
    # cache cap. `fail-fast: false` lets both graphs report independently.
    needs: classify_changes
    if: github.event_name != 'pull_request' && needs.classify_changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - default
          - failpoints
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
      AWS_ALLOW_HTTP: "true"
      AWS_S3_FORCE_PATH_STYLE: "true"
      OMNIGRAPH_S3_TEST_BUCKET: omnigraph-ci
      OMNIGRAPH_S3_TEST_PREFIX: github-actions
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev python3-pip

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # One cache per feature graph avoids both feature thrash and the
          # previous five copies of the shared substrate.
          key: ${{ matrix.shard }}
          workspaces: |
            . -> target

      - name: Start RustFS
        # Pinned to 1.0.0-beta.8 (2026-06-10). beta.4+ refuses "default"
        # credentials (rustfsadmin/rustfsadmin) unless
        # RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS=true is set — fine for
        # an ephemeral CI container. The three S3 suites were validated
        # against the beta.8 binary locally before this bump. Keep the pin
        # explicit (never `latest`) so upgrades are deliberate.
        run: |
          docker rm -f rustfs >/dev/null 2>&1 || true
          docker run -d \
            --name rustfs \
            -p 9000:9000 \
            -p 9001:9001 \
            -e RUSTFS_ACCESS_KEY="${AWS_ACCESS_KEY_ID}" \
            -e RUSTFS_SECRET_KEY="${AWS_SECRET_ACCESS_KEY}" \
            -e RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS=true \
            rustfs/rustfs:1.0.0-beta.8 \
            /data

      - name: Install AWS CLI
        run: |
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create RustFS test bucket
        run: |
          for _ in $(seq 1 30); do
            if aws --endpoint-url "${AWS_ENDPOINT_URL_S3}" s3api list-buckets >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          aws --endpoint-url "${AWS_ENDPOINT_URL_S3}" \
            s3api create-bucket \
            --bucket "${OMNIGRAPH_S3_TEST_BUCKET}" >/dev/null 2>&1 || true

      # Compile and execute the selected default targets in one Cargo resolve.
      # A superset prebuild followed by narrower commands would still rebuild
      # workspace crates under different feature fingerprints.
      - name: Run RustFS default integration graph
        if: matrix.shard == 'default'
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/rustfs-default.log"
          cargo test --locked \
            -p omnigraph-engine \
            -p omnigraph-server \
            -p omnigraph-cluster \
            -p omnigraph-cli \
            --test s3_storage \
            --test lance_surface_guards \
            --test memwal_enrollment_gate \
            --test s3 \
            --test s3_cluster \
            --test system_local \
            -- --nocapture 2>&1 | tee "$test_log"

          if grep -Eiq \
            "SKIP (public_physical_ref_token_rejects_s3_same_version_aba|s3_memwal_enrollment_gate_positive_and_listing_negatives)|skipping s3 " \
            "$test_log"
          then
            echo "::error::a configured RustFS test emitted its unconfigured skip"
            exit 1
          fi

          for test_name in \
            s3_compatible_graph_lifecycle_works \
            s3_branch_change_merge_flow_works \
            s3_public_load_uses_hidden_run_and_publishes \
            s3_adapter_conditional_writes_contract \
            s3_schema_apply_migrates_live_graph \
            s3_fresh_branch_traversal_reuses_main_graph_index_with_etags \
            public_physical_ref_token_rejects_s3_same_version_aba \
            s3_memwal_enrollment_gate_positive_and_listing_negatives \
            server_opens_s3_graph_directly_and_serves_snapshot_and_read \
            server_boots_cluster_from_bare_storage_uri_and_serves_query \
            s3_cluster_full_lifecycle_import_apply_serve_evolve_delete \
            local_cli_s3_end_to_end_init_load_read_flow
          do
            grep -Eq "test ${test_name} \.\.\. ok" "$test_log" \
              || { echo "::error::required RustFS cell '${test_name}' did not execute normally"; exit 1; }
          done

      # NOTE: the RFC-013 step-3a data-table opener COST gate (write_cost_s3) used
      # to run here. It is a deterministic IO-count gate, not a correctness test —
      # performance/cost contracts belong in a dedicated perf harness on a stable
      # runner + own cadence, not on the every-merge correctness path. Moved out of
      # CI pending that harness; run it on demand with a bucket set:
      #   OMNIGRAPH_S3_TEST_BUCKET=… cargo test -p omnigraph-engine --test write_cost_s3

      - name: Run RustFS recovery-sidecar lifecycle
        if: matrix.shard == 'failpoints'
        # Sidecar put/list/delete through the S3 storage backend on a
        # real bucket (the failpoint only wedges the publisher; the
        # sidecar I/O is exercised for real). Name filter `s3_` matches
        # the bucket-gated tests in the failpoints target only; the
        # grep guards against the filter going vacuous (cargo passes
        # with 0 tests matched) if those tests are ever renamed.
        run: |
          set +e
          output=$(cargo test --locked -p omnigraph-engine --features failpoints --test failpoints s3_ -- --nocapture 2>&1); status=$?
          set -e
          echo "$output"
          [ "$status" -eq 0 ] || exit "$status"
          echo "$output" | grep -Eq "test result: ok\. [1-9][0-9]* passed" \
            || { echo "::error::filter 's3_' matched no tests — vacuous pass"; exit 1; }

          set +e
          output=$(cargo test --locked -p omnigraph-engine --features failpoints --test memwal_stream s3_provider_shard_manifest_failure_retains_unreferenced_generation -- --exact --nocapture 2>&1); status=$?
          set -e
          echo "$output"
          [ "$status" -eq 0 ] || exit "$status"
          echo "$output" | grep -Fq "SKIP s3_provider_shard_manifest_failure_retains_unreferenced_generation" \
            && { echo "::error::RustFS B2a provider-failure cell skipped — vacuous pass"; exit 1; }
          echo "$output" | grep -Eq "test result: ok\. 1 passed" \
            || { echo "::error::RustFS B2a provider-failure filter matched no test — vacuous pass"; exit 1; }
          echo "$output" | grep -Eq "test s3_provider_shard_manifest_failure_retains_unreferenced_generation \.\.\. ok" \
            || { echo "::error::RustFS B2a provider-failure cell did not execute normally"; exit 1; }

          set +e
          output=$(cargo test --locked -p omnigraph-engine --features failpoints --test memwal_stream_cost gate_r0_widest_generation_closes_and_records_retain_all_growth_on_configured_rustfs -- --exact --nocapture 2>&1); status=$?
          set -e
          echo "$output"
          [ "$status" -eq 0 ] || exit "$status"
          echo "$output" | grep -Eq "test result: ok\. 1 passed" \
            || { echo "::error::RustFS Gate R0 filter matched no tests — vacuous pass"; exit 1; }
          echo "$output" | grep -Eq "test gate_r0_widest_generation_closes_and_records_retain_all_growth_on_configured_rustfs \.\.\. ok" \
            || { echo "::error::RustFS Gate R0 cell did not execute with positive-test polarity"; exit 1; }
          echo "$output" | grep -Fq "Gate R0 widest rustfs:" \
            || { echo "::error::RustFS Gate R0 test skipped instead of measuring configured storage"; exit 1; }

      - name: Dump RustFS logs on failure
        if: failure()
        run: docker logs rustfs
