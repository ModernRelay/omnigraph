[package]
name = "omnigraph-compiler"
version = "0.16.1"
edition = "2024"
description = "Schema/query compiler for Omnigraph. Zero Lance dependency."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
homepage = "https://github.com/ModernRelay/omnigraph"
documentation = "https://docs.rs/omnigraph-compiler"

[dependencies]
arrow-array = { workspace = true }
arrow-cast = { workspace = true }
arrow-ipc = { workspace = true }
arrow-json = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
chrono = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
stacker = { workspace = true }
ulid = { workspace = true }
# The shared generators of the generated laws (`src/arbitrary.rs`).
proptest = { version = "1", optional = true }

[features]
# Exposes `omnigraph_compiler::arbitrary` to dependents' test builds;
# enabled only through dev-dependencies (forbidden_apis.rs pins this).
test-util = ["dep:proptest"]

[dev-dependencies]
# The parse, print and parse property (src/query/syntax/tests/round_trip.rs).
proptest = "1"

[lints]
workspace = true
