[package]
name = "omnigraph-reference"
version = "0.15.1"
edition = "2024"
description = "A reference interpreter of the GQ core IR: the GQT corpus's differential oracle. Never published."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
publish = false

[dependencies]
frostem = { workspace = true, features = ["english"] }
libm = { workspace = true }
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.15.1" }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }

[lints]
workspace = true
