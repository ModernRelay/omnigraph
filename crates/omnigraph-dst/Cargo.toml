# omnigraph's deterministic-simulation-testing crate —
# the slatedb-dst pattern. Owns the harness, oracles, catalogs, instruments,
# and its own fixtures; the engine keeps only the injection seams.
# Run from this directory (its [env]-only .cargo/config.toml supplies the
# pool trio): cd crates/omnigraph-dst && cargo test. The required
# --cfg tokio_unstable comes from the workspace .cargo/config.toml.
[package]
name = "omnigraph-dst"
version = "0.11.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["failpoints"]
failpoints = ["omnigraph-engine/failpoints"]

[dependencies]
omnigraph-engine = { path = "../omnigraph", version = "0.11.0", features = ["dst"] }
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.11.0" }
arrow-array = { workspace = true }
lance-core = { workspace = true }
lance-io = { workspace = true }
object_store = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
globset = { workspace = true }
# test-util (Builder::start_paused, virtual clock) is DST-only; keeping
# it off the workspace-wide tokio dep keeps it out of the shipping crates.
tokio = { workspace = true, features = ["test-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
