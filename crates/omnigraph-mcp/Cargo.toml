[package]
name = "omnigraph-mcp"
version = "0.14.1"
edition = "2024"
description = "MCP protocol adapter for the Omnigraph graph database."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
homepage = "https://github.com/ModernRelay/omnigraph"
documentation = "https://docs.rs/omnigraph-mcp"

[dependencies]
omnigraph-skill = { path = "../../skills", version = "0.14.1" }
axum = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
rmcp = { version = "=3.3.0", default-features = false, features = ["server", "transport-streamable-http-server"] }

[lints]
workspace = true
