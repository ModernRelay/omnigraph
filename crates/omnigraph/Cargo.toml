[package]
name = "omnigraph-engine"
version = "0.13.0"
edition = "2024"
description = "Runtime engine for the Omnigraph graph database."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
homepage = "https://github.com/ModernRelay/omnigraph"
documentation = "https://docs.rs/omnigraph-engine"

[lib]
name = "omnigraph"

[features]
default = []
failpoints = ["omnigraph-seams/decide", "omnigraph-core/failpoints", "omnigraph-catalog/failpoints"]
# Test-only authority (PR #527 review P1-5): the DST seams' INSTALLERS
# (seeded IDs, logical clock, gate hook), the mutable Lance registry
# re-export, the harness-added injected-storage constructors
# (init_with_storage, open_read_only_with_storage), and the
# bottom-listing (`dst_list_all_keys`) exist only under this non-default
# feature. Default builds keep direct real-ID/real-clock paths and
# expose no dst_* authority. Deliberate exception: `open_with_storage`
# predates the harness and stays public unconditionally. Scope note:
# "default builds" means per-package builds (`-p`, and bare cargo via
# default-members); any `--workspace` invocation unifies this feature IN
# through the omnigraph-dst dev crate — release artifacts build with
# `-p` and stay clean, and dst.yml lints the `-p` shape per PR.
dst = ["omnigraph-storage/dst", "omnigraph-seams/install", "omnigraph-core/dst", "omnigraph-catalog/dst"]
# Test-only: `Session::with_read_executor`, the seam through which a session's
# reads run on another executor (the reference engine GQT compares against).
test-util = ["omnigraph-catalog/test-util"]

[dependencies]
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.13.0" }
omnigraph-policy = { path = "../omnigraph-policy", version = "0.13.0" }
omnigraph-storage = { path = "../omnigraph-storage", version = "0.13.0" }
omnigraph-seams = { path = "../omnigraph-seams", version = "0.13.0" }
omnigraph-core = { path = "../omnigraph-core", version = "0.13.0" }
omnigraph-catalog = { path = "../omnigraph-catalog", version = "0.13.0" }
omnigraph-planner = { path = "../omnigraph-planner", version = "0.13.0" }
lance = { workspace = true }
lance-core = { workspace = true }
lance-select = { workspace = true }
lance-datafusion = { workspace = true }
datafusion = { workspace = true }
lance-file = { workspace = true }
lance-index = { workspace = true }
lance-linalg = { workspace = true }
lance-namespace = { workspace = true }
lance-table = { workspace = true }
prost = "0.14"
aho-corasick = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-ord = { workspace = true }
arrow-select = { workspace = true }
arrow-string = { workspace = true }
arrow-cast = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
reqwest = { workspace = true }
object_store = { workspace = true }
lance-io = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
arc-swap = { workspace = true }

[dev-dependencies]
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.13.0" }
omnigraph-core = { path = "../omnigraph-core", version = "0.13.0", features = ["test-util"] }
omnigraph-catalog = { path = "../omnigraph-catalog", version = "0.13.0", features = ["test-util"] }
tokio = { workspace = true }
lance-namespace-impls = { workspace = true }
# test-util gates IoStats.requests + assert_io_eq! (failure diagnostics only); dev-dep,
# so production builds (which exclude dev-deps) never see it.
lance-io = { version = "11.0.0", features = ["test-util"] }
serial_test = "3"
proptest = "1"
# tests/forbidden_apis.rs walks the engine's sources.
syn = { workspace = true }
toml = "0.9"
libc = "0.2"

[lints]
workspace = true
