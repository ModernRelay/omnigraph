[package]
name = "omnigraph-engine"
version = "0.10.0"
edition = "2024"
description = "Runtime engine for the Omnigraph graph database."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
homepage = "https://github.com/ModernRelay/omnigraph"
documentation = "https://docs.rs/omnigraph-engine"

[lib]
name = "omnigraph"

[features]
default = []
failpoints = ["dep:fail-parallel", "fail-parallel/failpoints"]
# Test-only authority (PR #527 review P1-5): the DST seams' INSTALLERS
# (seeded IDs, logical clock, gate hook), the mutable Lance registry
# re-export, the harness-added injected-storage constructors
# (init_with_storage, open_read_only_with_storage), and the
# bottom-listing (`dst_list_all_keys`) exist only under this non-default
# feature. Default builds keep direct real-ID/real-clock paths and
# expose no dst_* authority. Deliberate exception: `open_with_storage`
# predates the harness and stays public unconditionally. Scope note:
# "default builds" means per-package builds (`-p`, and bare cargo via
# default-members); any `--workspace` invocation unifies this feature IN
# through the omnigraph-dst dev crate — release artifacts build with
# `-p` and stay clean, and dst.yml lints the `-p` shape per PR.
dst = ["omnigraph-storage/dst"]

[dependencies]
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.10.0" }
omnigraph-policy = { path = "../omnigraph-policy", version = "0.10.0" }
omnigraph-storage = { path = "../omnigraph-storage", version = "0.10.0" }
lance = { workspace = true }
lance-core = { workspace = true }
lance-select = { workspace = true }
lance-datafusion = { workspace = true }
datafusion = { workspace = true }
lance-file = { workspace = true }
lance-index = { workspace = true }
frostem = { workspace = true }
lance-tokenizer = { workspace = true }
stop-words = { workspace = true }
unicode-normalization = { workspace = true }
lance-linalg = { workspace = true }
lance-namespace = { workspace = true }
lance-table = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-ord = { workspace = true }
arrow-select = { workspace = true }
arrow-string = { workspace = true }
arrow-cast = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
reqwest = { workspace = true }
object_store = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
fail-parallel = { workspace = true, optional = true }
time = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
arc-swap = { workspace = true }

[dev-dependencies]
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.10.0" }
tokio = { workspace = true }
lance-namespace-impls = { workspace = true }
# test-util gates IoStats.requests + assert_io_eq! (failure diagnostics only); dev-dep,
# so production builds (which exclude dev-deps) never see it.
lance-io = { version = "11.0.0", features = ["test-util"] }
serial_test = "3"
proptest = "1"
syn = { version = "2", features = ["full", "visit"] }
toml = "0.9"
# benches/scenarios.rs: wait4/rusage peak-RSS and benchmark memory caps.
libc = "0.2"

[[bench]]
# Scenario benchmark harness — a decision instrument, not a CI gate. One cold
# instrumented subprocess per scenario, JSON lines out. See docs/dev/testing.md
# "Examples & benches". `harness = false`: the file provides its own main.
name = "scenarios"
harness = false

[lints]
workspace = true
