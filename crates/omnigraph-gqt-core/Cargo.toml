[package]
name = "omnigraph-gqt-core"
version = "0.13.0"
edition = "2024"
description = "GQT format and execution over an existing engine session"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
libm = "=0.2.16"
omnigraph = { package = "omnigraph-engine", path = "../omnigraph", version = "0.13.0" }
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.13.0" }
omnigraph-planner = { path = "../omnigraph-planner", version = "0.13.0" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
unsafe-libyaml = "0.2.11"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
