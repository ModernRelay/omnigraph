[package]
name = "omnigraph-planner"
version = "0.11.0"
edition = "2024"
description = "Logical and physical plans, optimizer passes and the routing registry for Omnigraph operations. Zero Lance dependency."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
homepage = "https://github.com/ModernRelay/omnigraph"
documentation = "https://docs.rs/omnigraph-planner"

[dependencies]
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.11.0" }
arrow-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
