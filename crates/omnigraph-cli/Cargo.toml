[package]
name = "omnigraph-cli"
version = "0.10.0"
edition = "2024"
description = "CLI for the Omnigraph graph database."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
homepage = "https://github.com/ModernRelay/omnigraph"
documentation = "https://docs.rs/omnigraph-cli"

[[bin]]
name = "omnigraph"
path = "src/main.rs"

[dependencies]
omnigraph = { package = "omnigraph-engine", path = "../omnigraph", version = "0.10.0" }
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.10.0" }
omnigraph-api-types = { path = "../omnigraph-api-types", version = "0.10.0" }
omnigraph-cluster = { path = "../omnigraph-cluster", version = "0.10.0" }
omnigraph-policy = { path = "../omnigraph-policy", version = "0.10.0" }
omnigraph-server = { path = "../omnigraph-server", version = "0.10.0" }
clap = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util"] }
reqwest = { workspace = true, features = ["blocking", "stream"] }
futures = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
time = { workspace = true, features = ["parsing"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = { workspace = true }
tempfile = { workspace = true }
lance = { workspace = true }
lance-index = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
