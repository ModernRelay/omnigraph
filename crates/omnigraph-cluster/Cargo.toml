[package]
name = "omnigraph-cluster"
version = "0.14.1"
edition = "2024"
description = "Cluster configuration validation, planning, and config-only apply for Omnigraph."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
homepage = "https://github.com/ModernRelay/omnigraph"
documentation = "https://docs.rs/omnigraph-cluster"

[features]
# Fault-injection hooks for the apply protocol (crash-mid-apply, CAS-race
# tests), including cluster/engine boundary failures.
failpoints = ["omnigraph/failpoints"]
# Test support reached by the server's tests: read a local cluster's serving
# snapshot as if its storage root were spelled differently.
test-util = []

[dependencies]
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.14.1" }
omnigraph = { package = "omnigraph-engine", path = "../omnigraph", version = "0.14.1" }
omnigraph-storage = { path = "../omnigraph-storage", version = "0.14.1" }
omnigraph-policy = { path = "../omnigraph-policy", version = "0.14.1" }
omnigraph-seams = { path = "../omnigraph-seams", version = "0.14.1" }
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
# Runtime handle only — best-effort async lock release in
# StateLockGuard::drop on object-store backends (cluster commands always
# run inside the caller's tokio runtime).
tokio = { workspace = true }
# The lease's fence and takeover records: lock ids and timing, never paths.
tracing = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
serial_test = "3"
tempfile = { workspace = true }
# Paused time for the lease tests, so the crate's own test build runs them.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
