[package]
name = "omnigraph-server"
version = "0.14.1"
edition = "2024"
description = "HTTP server for the Omnigraph graph database."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
homepage = "https://github.com/ModernRelay/omnigraph"
documentation = "https://docs.rs/omnigraph-server"

[[bin]]
name = "omnigraph-server"
path = "src/main.rs"

[features]
default = []
# Enables the AWS Secrets Manager bearer-token source. Off by default — on-prem
# and local-dev builds don't pay the AWS SDK compile cost.
aws = ["dep:aws-config", "dep:aws-sdk-secretsmanager"]

[dependencies]
omnigraph = { package = "omnigraph-engine", path = "../omnigraph", version = "0.14.1" }
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.14.1" }
omnigraph-policy = { path = "../omnigraph-policy", version = "0.14.1" }
omnigraph-api-types = { path = "../omnigraph-api-types", version = "0.14.1" }
omnigraph-cluster = { path = "../omnigraph-cluster", version = "0.14.1" }
omnigraph-mcp = { path = "../omnigraph-mcp", version = "0.14.1" }
axum = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
yaml_serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tower-http = { workspace = true }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "internal-logs"] }
tracing-opentelemetry = { version = "0.32", default-features = false }
utoipa = { workspace = true }
futures = { workspace = true }
url = { workspace = true }
headers = "0.4.1"
http-body-util = "0.1"
sha2 = { workspace = true }
base64 = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
libc = "0.2"
subtle = { workspace = true }
async-trait = { workspace = true }
arc-swap = { workspace = true }
dashmap = "6"
regex = { workspace = true }
thiserror = { workspace = true }
aws-config = { version = "1", optional = true, default-features = false, features = ["rustls", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-secretsmanager = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "testing"] }
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
omnigraph = { package = "omnigraph-engine", path = "../omnigraph", features = ["failpoints"] }
omnigraph-cluster = { path = "../omnigraph-cluster", version = "0.14.1", features = ["test-util", "failpoints"] }
tempfile = { workspace = true }
tower = { workspace = true }
serial_test = "3"
rsa = "0.9"
lance = { workspace = true }
lance-index = { workspace = true }
object_store = { workspace = true }
reqwest = { workspace = true }

[lints]
workspace = true
