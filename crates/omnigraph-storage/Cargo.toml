[package]
name = "omnigraph-storage"
version = "0.15.1"
edition = "2024"
description = "Shared local and object-store control-object storage boundary for Omnigraph."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
homepage = "https://github.com/ModernRelay/omnigraph"
documentation = "https://docs.rs/omnigraph-storage"

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Paused time for the scope's deadline tests and the conditional re-issue tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[features]
# See the engine crate's `dst` feature doc (PR #527 review P1-5).
dst = []
# The read-through storage contract as test bodies over a caller's stores
# (`read_through_contract`), so the local rows and the S3 rows of the engine's
# integration tests are one text. Dev-dependency only; the name is the one the
# engine's `forbidden_apis` scanner reads as the crate-boundary form of `cfg(test)`.
test-util = []
