[package]
name = "omnigraph-core"
version = "0.13.0"
edition = "2024"
description = "Shared base of the omnigraph engine crates: error type, Lance dataset access, request instrumentation, Lance native ref control and dataset addressing."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"

[features]
default = []
failpoints = ["omnigraph-seams/decide"]
dst = ["omnigraph-storage/dst", "omnigraph-seams/install"]
# test helpers other crates' tests reach across the boundary (cfg(test) is crate-local)
test-util = []

[dependencies]
omnigraph-storage = { path = "../omnigraph-storage", version = "0.13.0" }
omnigraph-seams = { path = "../omnigraph-seams", version = "0.13.0" }
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.13.0" }
lance = { workspace = true }
lance-core = { workspace = true }
datafusion = { workspace = true }
lance-index = { workspace = true }
frostem = { workspace = true }
lance-tokenizer = { workspace = true }
stop-words = { workspace = true }
unicode-normalization = { workspace = true }
lance-namespace = { workspace = true }
lance-table = { workspace = true }
prost = "0.14"
arrow-schema = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
object_store = { workspace = true }
lance-io = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
serial_test = "3"
lance-file = { workspace = true }
lance-linalg = { workspace = true }
arrow-array = { workspace = true }
toml = "0.9"

[lints]
workspace = true
