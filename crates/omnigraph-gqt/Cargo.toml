[package]
name = "omnigraph-gqt"
version = "0.15.1"
edition = "2024"
description = "GQ logic-test corpus (`cases/**/*.gqt`) and its runner; one named test per case."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
homepage = "https://github.com/ModernRelay/omnigraph"
publish = false

# No doc examples; skip the empty doctest target on every `cargo test -p`.
[lib]
doctest = false

[dependencies]
omnigraph-gqt-core = { path = "../omnigraph-gqt-core", version = "0.15.1" }
async-trait = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
omnigraph = { package = "omnigraph-engine", path = "../omnigraph", version = "0.15.1" }
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.15.1" }
# The core reference interpreter `--- expect same as reference` compares
# against; GQT is its one caller.
omnigraph-reference = { path = "../omnigraph-reference" }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
omnigraph-dst = { path = "../omnigraph-dst" }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
datatest-stable = "0.3"

# One libtest test per `cases/**/*.gqt`; mechanism and flags: tests/gq_logic_tests.rs.
[[test]]
name = "gq_logic_tests"
harness = false

[lints]
workspace = true
