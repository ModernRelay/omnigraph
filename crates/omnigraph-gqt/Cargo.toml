[package]
name = "omnigraph-gqt"
version = "0.15.1"
edition = "2024"
description = "GQ logic-test corpus (`cases/**/*.gqt`) and its runner; one named test per case."
license = "MIT"
repository = "https://github.com/ModernRelay/omnigraph"
homepage = "https://github.com/ModernRelay/omnigraph"
publish = false

# No doc examples; skip the empty doctest target on every `cargo test -p`.
[lib]
doctest = false

[dependencies]
omnigraph-gqt-core = { path = "../omnigraph-gqt-core", version = "0.15.1" }
async-trait = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
omnigraph = { package = "omnigraph-engine", path = "../omnigraph", version = "0.15.1" }
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.15.1" }
# The core reference interpreter every read step on the direct engine is
# compared with; GQT is its one caller.
omnigraph-reference = { path = "../omnigraph-reference" }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
omnigraph-dst = { path = "../omnigraph-dst" }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
datatest-stable = "0.3"
# The generated laws (tests/integration/law_*.rs) draw from the compiler's
# shared generators.
omnigraph-compiler = { path = "../omnigraph-compiler", version = "0.15.1", features = ["test-util"] }
proptest = "1"
# tests/runner_dispatch.rs lists an `s3://` base's objects through the storage crate's test helper.
omnigraph-storage = { path = "../omnigraph-storage", version = "0.15.1", features = ["test-util"] }

# One libtest test per `cases/**/*.gqt`; mechanism and flags: tests/gq_logic_tests.rs.
[[test]]
name = "gq_logic_tests"
harness = false

# Every direct-engine case under each physical layout; tests/gq_layout_tests.rs.
[[test]]
name = "gq_layout_tests"
harness = false

[lints]
workspace = true
